<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO - Animation Test</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #020617;
  color: #fff;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.stage {
  position: relative;
  min-height: 720px;
  overflow: hidden;
  background:
    radial-gradient(circle at 70% 35%, rgba(139,92,246,.26), transparent 35%),
    linear-gradient(145deg, #020617, #071426 55%, #100b2d);
}

/* GRID */
.grid {
  position: absolute;
  inset: 0;
  opacity: .45;
  background-image:
    linear-gradient(rgba(103,232,249,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103,232,249,.12) 1px, transparent 1px);
  background-size: 46px 46px;
}

/* =========================
   MOVING SIGNALS
   ========================= */

.signals {
  position: absolute;
  inset: 0;
}

.signal {
  position: absolute;
  bottom: -150px;
  width: 4px;
  border-radius: 999px;
  background: linear-gradient(
    to bottom,
    transparent,
    #22d3ee,
    #818cf8,
    #ec4899,
    transparent
  );
  box-shadow:
    0 0 8px #22d3ee,
    0 0 22px rgba(129,140,248,.8);
  animation: signal-rise 4s ease-in-out infinite alternate;
}

@keyframes signal-rise {
  0% {
    transform: translateY(150px);
    opacity: .15;
  }
  50% {
    opacity: .9;
  }
  100% {
    transform: translateY(-190px);
    opacity: .35;
  }
}

.signal:nth-child(2n) {
  animation-duration: 5.2s;
}

.signal:nth-child(3n) {
  animation-duration: 3.1s;
  animation-delay: -1.3s;
}

.signal:nth-child(5n) {
  animation-delay: -2.4s;
}

/* =========================
   ORB
   ========================= */

.orb {
  position: absolute;
  right: 10%;
  top: 145px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%,
      #ecfeff 0,
      #22d3ee 13%,
      #2563eb 40%,
      #7c3aed 68%,
      #020617 76%
    );
  box-shadow:
    0 0 30px #22d3ee,
    0 0 90px rgba(124,58,237,.75);
  animation: orb-float 3.2s ease-in-out infinite alternate;
}

@keyframes orb-float {
  from {
    transform: translateY(-22px) scale(.95);
  }
  to {
    transform: translateY(22px) scale(1.05);
  }
}

/* ring around orb */
.orb::before {
  content: "";
  position: absolute;
  inset: -28px;
  border: 2px dashed rgba(103,232,249,.65);
  border-radius: 50%;
  animation: spin 10s linear infinite;
}

.orb::after {
  content: "";
  position: absolute;
  inset: 45px;
  border: 2px solid rgba(255,255,255,.33);
  border-radius: 50%;
  animation: spin-reverse 5s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes spin-reverse {
  to {
    transform: rotate(-360deg);
  }
}

/* =========================
   CONTENT
   ========================= */

.overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      rgba(2,6,23,.94),
      rgba(2,6,23,.72) 45%,
      rgba(2,6,23,.12) 80%
    );
}

.content {
  position: relative;
  z-index: 10;
  padding: 80px 7%;
}

.eyebrow {
  color: #67e8f9;
  font-family: Consolas, monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 6px;
}

.name {
  margin-top: 50px;
  font-size: clamp(72px, 11vw, 138px);
  line-height: .72;
  font-weight: 1000;
  letter-spacing: -8px;
  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;
}

.role {
  margin-top: 36px;
  font-size: 18px;
  font-weight: 700;
}

.role b {
  color: #c4b5fd;
}

.status {
  margin-top: 35px;
  display: inline-block;
  padding: 12px 18px;
  border: 1px solid rgba(103,232,249,.3);
  border-radius: 10px;
  background: rgba(2,6,23,.62);
  backdrop-filter: blur(12px);
  font-family: Consolas, monospace;
}

/* =========================
   BLINK TEST
   ========================= */

.cursor {
  display: inline-block;
  width: 10px;
  height: 20px;
  margin-left: 7px;
  vertical-align: -3px;
  background: #4ade80;
  animation: blink .65s step-end infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

/* =========================
   JS PANEL
   ========================= */

.js-panel {
  position: absolute;
  z-index: 20;
  right: 6%;
  bottom: 45px;
  width: 310px;
  padding: 18px;
  border: 1px solid rgba(196,181,253,.35);
  border-radius: 15px;
  background: rgba(15,7,35,.72);
  backdrop-filter: blur(18px);
}

.js-label {
  color: #c4b5fd;
  font: 700 11px Consolas, monospace;
  letter-spacing: 3px;
}

#counter {
  margin-top: 10px;
  font: 900 31px Consolas, monospace;
  color: #4ade80;
}

button {
  margin-top: 15px;
  padding: 11px 15px;
  border: 0;
  border-radius: 8px;
  background: #7c3aed;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  background: #9333ea;
}

/* JS switches this */
.coffee-mode {
  background:
    radial-gradient(circle at 70% 35%, rgba(245,158,11,.38), transparent 38%),
    linear-gradient(145deg, #180d03, #422006, #052e16);
}
</style>
</head>

<body>

<section id="stage" class="stage">

  <div class="signals">
    <i class="signal" style="left:5%;height:280px;"></i>
    <i class="signal" style="left:10%;height:335px;"></i>
    <i class="signal" style="left:15%;height:390px;"></i>
    <i class="signal" style="left:20%;height:440px;"></i>
    <i class="signal" style="left:25%;height:485px;"></i>
    <i class="signal" style="left:30%;height:525px;"></i>
    <i class="signal" style="left:35%;height:555px;"></i>
    <i class="signal" style="left:40%;height:580px;"></i>
    <i class="signal" style="left:45%;height:595px;"></i>
    <i class="signal" style="left:50%;height:600px;"></i>
    <i class="signal" style="left:55%;height:595px;"></i>
    <i class="signal" style="left:60%;height:580px;"></i>
    <i class="signal" style="left:65%;height:555px;"></i>
    <i class="signal" style="left:70%;height:525px;"></i>
    <i class="signal" style="left:75%;height:485px;"></i>
    <i class="signal" style="left:80%;height:440px;"></i>
    <i class="signal" style="left:85%;height:390px;"></i>
    <i class="signal" style="left:90%;height:335px;"></i>
    <i class="signal" style="left:95%;height:280px;"></i>
  </div>

  <div class="grid"></div>

  <div class="orb"></div>

  <div class="overlay"></div>

  <div class="content">

    <div class="eyebrow">
      ANIMATION SYSTEM TEST
    </div>

    <div class="name">
      TEPPEI
      <br>
      <span>JOUDO</span>
    </div>

    <div class="role">
      SAP ABAP Developer /
      <b>AI Explorer</b>
    </div>

    <div class="status">
      CSS ANIMATION ACTIVE
      <span class="cursor"></span>
    </div>

  </div>

  <div class="js-panel">

    <div class="js-label">
      JAVASCRIPT RUNTIME
    </div>

    <div id="counter">
      0000
    </div>

    <button id="coffeeButton" type="button">
      ☕ RUN COFFEE PATCH
    </button>

  </div>

</section>

<script>
const counter = document.getElementById("counter");
const stage = document.getElementById("stage");
const coffeeButton = document.getElementById("coffeeButton");

let value = 0;

setInterval(() => {
  value++;
  counter.textContent =
    String(value).padStart(4, "0");
}, 250);

coffeeButton.addEventListener("click", () => {
  stage.classList.toggle("coffee-mode");
});
</script>

</body>
</html>
