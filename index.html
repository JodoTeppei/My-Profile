<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow: hidden;

  background: #020617;
  color: #ffffff;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}


/* ==================================================
   PROFILE FRAME
================================================== */

.profile {
  position: relative;

  width: 100%;
  height: 620px;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 77% 36%,
      rgba(139, 92, 246, .32),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(236, 72, 153, .16),
      transparent 25%
    ),
    linear-gradient(
      145deg,
      #020617,
      #071426 52%,
      #100b2d
    );
}


/* ==================================================
   MOVING SIGNAL FIELD
================================================== */

.signals {
  position: absolute;
  inset: 0;

  overflow: hidden;

  pointer-events: none;
}

.signal {
  position: absolute;

  bottom: -110px;

  width: 3px;

  border-radius: 999px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #22d3ee,
      #818cf8,
      #ec4899,
      transparent
    );

  box-shadow:
    0 0 7px #22d3ee,
    0 0 18px rgba(129, 140, 248, .8);

  opacity: .65;

  animation:
    signalMove 4s
    ease-in-out
    infinite alternate;
}

@keyframes signalMove {

  from {
    transform:
      translateY(130px);

    opacity: .22;
  }

  50% {
    opacity: .92;
  }

  to {
    transform:
      translateY(-170px);

    opacity: .40;
  }

}

.signal:nth-child(2n) {
  animation-duration: 5.2s;
}

.signal:nth-child(3n) {
  animation-duration: 3.1s;
}

.signal:nth-child(4n) {
  animation-delay: -1.5s;
}

.signal:nth-child(5n) {
  animation-delay: -2.5s;
}


/* ==================================================
   GRID
================================================== */

.grid {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background-image:

    linear-gradient(
      rgba(103, 232, 249, .07) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(103, 232, 249, .07) 1px,
      transparent 1px
    );

  background-size:
    44px 44px;
}


/* ==================================================
   READABILITY
================================================== */

.overlay {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(2, 6, 23, .96) 0%,
      rgba(2, 6, 23, .78) 38%,
      rgba(2, 6, 23, .32) 68%,
      rgba(2, 6, 23, .08) 100%
    );
}


/* ==================================================
   AI ORB
================================================== */

.orb {
  position: absolute;

  right: 9%;
  top: 118px;

  width: 205px;
  height: 205px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ecfeff 0,
      #22d3ee 13%,
      #2563eb 38%,
      #7c3aed 66%,
      #020617 77%
    );

  box-shadow:
    0 0 25px #22d3ee,
    0 0 75px rgba(124, 58, 237, .70);

  animation:
    orbFloat 3.3s
    ease-in-out
    infinite alternate;
}

@keyframes orbFloat {

  from {
    transform:
      translateY(-15px)
      scale(.97);
  }

  to {
    transform:
      translateY(15px)
      scale(1.03);
  }

}

.orb::before {
  content: "";

  position: absolute;
  inset: -28px;

  border:
    2px dashed
    rgba(103, 232, 249, .55);

  border-radius: 50%;

  animation:
    spin 12s
    linear
    infinite;
}

.orb::after {
  content: "";

  position: absolute;
  inset: 39px;

  border:
    1px solid
    rgba(255, 255, 255, .35);

  border-radius: 50%;

  animation:
    spinReverse 5s
    linear
    infinite;
}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

@keyframes spinReverse {

  to {
    transform:
      rotate(-360deg);
  }

}


/* ==================================================
   HUGE BACKGROUND TYPE
================================================== */

.back-type {
  position: absolute;

  right: -20px;
  bottom: -10px;

  color:
    rgba(255, 255, 255, .035);

  font-size: 160px;
  font-weight: 1000;
  line-height: .72;

  letter-spacing: -10px;

  text-align: right;

  pointer-events: none;
}


/* ==================================================
   CONTENT
================================================== */

.content {
  position: relative;
  z-index: 10;

  padding:
    58px 6%;
}

.eyebrow {
  color: #67e8f9;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 6px;
}

.name {
  margin-top: 34px;

  font-size:
    clamp(
      66px,
      10vw,
      120px
    );

  line-height: .70;

  font-weight: 1000;

  letter-spacing: -7px;

  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;

  text-shadow:
    4px 4px 0
    rgba(67, 56, 202, .82),

    0 0 22px
    rgba(34, 211, 238, .25);
}

.role {
  margin-top: 29px;

  color: #f8fafc;

  font-size: 17px;

  font-weight: 700;
}

.role strong {
  color: #c4b5fd;
}

.description {
  margin-top: 15px;

  max-width: 600px;

  color: #cbd5e1;

  font-size: 15px;

  line-height: 1.8;
}


/* ==================================================
   GAME LAUNCHER
================================================== */

.launch-area {
  margin-top: 27px;
}

.play-button {
  position: relative;

  padding:
    15px 25px;

  border:
    1px solid #67e8f9;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #0891b2,
      #4338ca
    );

  color: #ffffff;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 14px;

  font-weight: 700;

  letter-spacing: 2px;

  cursor: pointer;

  box-shadow:
    0 0 15px
    rgba(34, 211, 238, .30);

  transition:
    transform .2s,
    box-shadow .2s,
    background .2s;
}

.play-button:hover {

  transform:
    translateY(-3px);

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #7c3aed
    );

  box-shadow:
    0 0 30px
    rgba(34, 211, 238, .60);
}

.launch-note {
  margin-top: 10px;

  color: #64748b;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;

  letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

.status {
  position: absolute;

  right: 30px;
  bottom: 24px;

  z-index: 12;

  color: #4ade80;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: 3px;
}

.status::before {
  content: "●";

  display: inline-block;

  margin-right: 7px;

  animation:
    statusBlink
    .8s
    step-end
    infinite;
}

@keyframes statusBlink {

  50% {
    opacity: .2;
  }

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (
  max-width: 780px
) {

  .profile {
    height: 620px;
  }

  .orb {
    right: -30px;
    top: 120px;

    width: 160px;
    height: 160px;

    opacity: .40;
  }

  .content {
    padding:
      45px 7%;
  }

  .description {
    max-width: 470px;
  }

}

</style>
</head>
