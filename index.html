<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO | ABAP GAMES</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #020617;
  color: #ffffff;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}

button {
  font: inherit;
}

.app {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #020617;
}


/* ==================================================
   PROFILE
================================================== */

.profile {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 77% 36%,
      rgba(139, 92, 246, .30),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(236, 72, 153, .14),
      transparent 25%
    ),
    linear-gradient(
      145deg,
      #020617,
      #071426 52%,
      #100b2d
    );

  transition:
    filter .3s ease,
    transform .3s ease;
}

.app.game-open .profile {
  filter: brightness(.38);
  transform: scale(1.01);
}


/* ==================================================
   PROFILE ANIMATION PAUSE
================================================== */

.app.game-open .signal,
.app.game-open .orb,
.app.game-open .orb::before,
.app.game-open .orb::after,
.app.game-open .system-status::before {
  animation-play-state: paused;
}


/* ==================================================
   MOVING SIGNALS
================================================== */

.signals {
  position: absolute;
  inset: 0;

  overflow: hidden;

  pointer-events: none;
}

.signal {
  position: absolute;

  bottom: -24%;

  width:
    clamp(
      2px,
      .25vw,
      4px
    );

  border-radius: 999px;

  opacity: .62;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #22d3ee,
      #818cf8,
      #ec4899,
      transparent
    );

  box-shadow:
    0 0 6px rgba(34, 211, 238, .8);

  animation:
    signalMove 4s
    ease-in-out
    infinite alternate;
}

@keyframes signalMove {

  from {
    transform:
      translateY(22vh);

    opacity: .20;
  }

  50% {
    opacity: .82;
  }

  to {
    transform:
      translateY(-28vh);

    opacity: .36;
  }
}

.signal:nth-child(2n) {
  animation-duration: 5.2s;
}

.signal:nth-child(3n) {
  animation-duration: 3.1s;
}

.signal:nth-child(4n) {
  animation-delay: -1.5s;
}

.signal:nth-child(5n) {
  animation-delay: -2.5s;
}


/* ==================================================
   PROFILE GRID
================================================== */

.profile-grid {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(103, 232, 249, .06) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(103, 232, 249, .06) 1px,
      transparent 1px
    );

  background-size:
    clamp(28px, 4vw, 48px)
    clamp(28px, 4vw, 48px);
}


/* ==================================================
   PROFILE OVERLAY
================================================== */

.profile-overlay {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(2, 6, 23, .96) 0%,
      rgba(2, 6, 23, .77) 38%,
      rgba(2, 6, 23, .31) 68%,
      rgba(2, 6, 23, .08) 100%
    );
}


/* ==================================================
   AI ORB
================================================== */

.orb {
  position: absolute;

  right: 9%;
  top: 18%;

  width:
    clamp(
      110px,
      17vw,
      205px
    );

  aspect-ratio: 1;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ecfeff 0,
      #22d3ee 13%,
      #2563eb 38%,
      #7c3aed 66%,
      #020617 77%
    );

  box-shadow:
    0 0 20px rgba(34, 211, 238, .9),
    0 0 55px rgba(124, 58, 237, .55);

  animation:
    orbFloat 3.3s
    ease-in-out
    infinite alternate;
}

@keyframes orbFloat {

  from {
    transform:
      translateY(-10px)
      scale(.98);
  }

  to {
    transform:
      translateY(10px)
      scale(1.02);
  }
}

.orb::before {
  content: "";

  position: absolute;
  inset: -13%;

  border:
    1px dashed
    rgba(103, 232, 249, .52);

  border-radius: 50%;

  animation:
    spin 12s
    linear
    infinite;
}

.orb::after {
  content: "";

  position: absolute;
  inset: 19%;

  border:
    1px solid
    rgba(255, 255, 255, .30);

  border-radius: 50%;

  animation:
    spinReverse 6s
    linear
    infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes spinReverse {
  to {
    transform: rotate(-360deg);
  }
}


/* ==================================================
   BACKGROUND TYPE
================================================== */

.back-type {
  position: absolute;

  right: -1%;
  bottom: -2%;

  color:
    rgba(255, 255, 255, .035);

  font-size:
    clamp(
      90px,
      14vw,
      180px
    );

  font-weight: 1000;
  line-height: .72;
  letter-spacing: -.07em;
  text-align: right;

  pointer-events: none;
}


/* ==================================================
   PROFILE CONTENT
================================================== */

.profile-content {
  position: relative;
  z-index: 10;

  padding:
    clamp(24px, 5vh, 60px)
    6%;
}

.eyebrow {
  color: #67e8f9;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      8px,
      1vw,
      11px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      3px,
      .5vw,
      6px
    );
}

.name {
  margin-top:
    clamp(
      18px,
      4.5vh,
      44px
    );

  font-size:
    clamp(
      52px,
      10vw,
      130px
    );

  line-height: .69;

  font-weight: 1000;

  letter-spacing:
    clamp(
      -8px,
      -.5vw,
      -3px
    );

  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;

  text-shadow:
    4px 4px 0 rgba(67, 56, 202, .82),
    0 0 20px rgba(34, 211, 238, .22);
}


/* ==================================================
   PLAY BUTTONS
================================================== */

.launch-area {
  margin-top:
    clamp(
      22px,
      5vh,
      46px
    );
}

.game-launch-buttons {
  display: flex;
  flex-wrap: wrap;

  gap: 12px;
}

.primary-button {
  padding:
    clamp(
      10px,
      1.4vh,
      15px
    )
    clamp(
      16px,
      2.3vw,
      26px
    );

  border:
    1px solid #67e8f9;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #0891b2,
      #4338ca
    );

  color: #ffffff;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      10px,
      1.15vw,
      14px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      1px,
      .2vw,
      2px
    );

  cursor: pointer;

  box-shadow:
    0 0 14px
    rgba(34, 211, 238, .28);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.primary-button:hover {
  transform:
    translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #7c3aed
    );

  box-shadow:
    0 0 24px
    rgba(34, 211, 238, .5);
}

.primary-button:focus-visible {
  outline:
    3px solid
    rgba(103, 232, 249, .7);

  outline-offset: 4px;
}

.runner-button {
  border-color: #4ade80;

  background:
    linear-gradient(
      135deg,
      #047857,
      #0891b2
    );

  box-shadow:
    0 0 14px
    rgba(74, 222, 128, .22);
}

.runner-button:hover {
  background:
    linear-gradient(
      135deg,
      #059669,
      #06b6d4
    );

  box-shadow:
    0 0 24px
    rgba(74, 222, 128, .42);
}

.launch-note {
  margin-top: 9px;

  color: #64748b;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      10px
    );

  letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

.system-status {
  position: absolute;

  right: 3%;
  bottom: 4%;

  z-index: 12;

  color: #4ade80;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      10px
    );

  font-weight: 700;
  letter-spacing: 3px;
}

.system-status::before {
  content: "●";

  display: inline-block;

  margin-right: 7px;

  animation:
    statusBlink
    .8s
    step-end
    infinite;
}

@keyframes statusBlink {

  50% {
    opacity: .2;
  }
}


/* ==================================================
   GAME MODAL
================================================== */

.game-modal {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    clamp(
      6px,
      1.2vw,
      14px
    );

  visibility: hidden;
  opacity: 0;
  pointer-events: none;

  background:
    rgba(2, 6, 23, .76);

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.game-modal.is-open {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}


/* ==================================================
   GAME WINDOW
================================================== */

.game-window {
  position: relative;

  width:
    min(
      96%,
      980px
    );

  height: 94%;

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .48);

  border-radius:
    clamp(
      8px,
      1.3vw,
      16px
    );

  background:
    linear-gradient(
      145deg,
      rgba(0, 8, 20, .98),
      rgba(15, 7, 35, .98)
    );

  box-shadow:
    0 0 25px
    rgba(34, 211, 238, .20),
    0 20px 60px
    rgba(0, 0, 0, .65);

  transform:
    scale(.94)
    translateY(10px);

  transition:
    transform .25s ease;
}

.game-modal.is-open
.game-window {
  transform:
    scale(1)
    translateY(0);
}

.game-window::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 2px;

  z-index: 4;

  background:
    linear-gradient(
      90deg,
      transparent,
      #22d3ee,
      #8b5cf6,
      #ec4899,
      transparent
    );
}


/* ==================================================
   GAME HEADER
================================================== */

.game-header {
  height:
    clamp(
      35px,
      7vh,
      48px
    );

  padding:
    0
    clamp(
      9px,
      1.4vw,
      16px
    );

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom:
    1px solid
    rgba(103, 232, 249, .16);

  background:
    rgba(2, 6, 23, .92);

  font-family:
    Consolas,
    "Courier New",
    monospace;
}

.game-header-left {
  display: flex;
  align-items: center;

  gap:
    clamp(
      6px,
      1vw,
      12px
    );
}

.game-title {
  color: #67e8f9;

  font-size:
    clamp(
      9px,
      1.2vw,
      14px
    );

  font-weight: 900;

  letter-spacing:
    clamp(
      1px,
      .25vw,
      3px
    );
}

.runtime-status {
  color: #4ade80;

  font-size:
    clamp(
      6px,
      .65vw,
      8px
    );

  letter-spacing: 2px;
}

.score {
  color: #4ade80;

  font-size:
    clamp(
      9px,
      1.2vw,
      14px
    );

  font-weight: 900;

  margin-left: auto;
}

.close-button {
  width:
    clamp(
      25px,
      2.8vw,
      32px
    );

  height:
    clamp(
      25px,
      2.8vw,
      32px
    );

  margin-left: 10px;

  border:
    1px solid
    rgba(251, 113, 133, .5);

  border-radius: 7px;

  background:
    rgba(127, 29, 29, .18);

  color: #fb7185;

  font-size:
    clamp(
      15px,
      1.7vw,
      19px
    );

  line-height: 1;

  cursor: pointer;
}

.close-button:hover {
  color: #ffffff;
  background: #be123c;
}


/* ==================================================
   GAME BODY
================================================== */

.game-body {
  position: relative;

  height:
    calc(
      100% -
      clamp(
        70px,
        14vh,
        92px
      )
    );

  padding:
    clamp(
      4px,
      .8vh,
      8px
    )
    clamp(
      6px,
      1.1vw,
      11px
    );
}

.game-shell {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .25);

  border-radius: 8px;

  background-color: #000814;

  background-image:
    linear-gradient(
      rgba(34, 211, 238, .065) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(34, 211, 238, .065) 1px,
      transparent 1px
    );

  background-size:
    32px 32px;
}

canvas {
  display: block;

  width: 100%;
  height: 100%;

  background: transparent;

  image-rendering: auto;

  outline: none;
}


/* ==================================================
   LOADING
================================================== */

.loading-overlay {
  position: absolute;

  inset:
    clamp(
      4px,
      .8vh,
      8px
    )
    clamp(
      6px,
      1.1vw,
      11px
    );

  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background:
    rgba(0, 8, 20, .98);

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.loading-overlay.is-hidden {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.loader-panel {
  width:
    min(
      86%,
      560px
    );

  padding:
    clamp(
      14px,
      2.5vh,
      24px
    );

  border:
    1px solid
    rgba(103, 232, 249, .3);

  border-radius: 12px;

  background:
    rgba(2, 6, 23, .93);

  font-family:
    Consolas,
    "Courier New",
    monospace;
}

.loader-title {
  color: #67e8f9;

  font-size:
    clamp(
      8px,
      .95vw,
      11px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      2px,
      .3vw,
      4px
    );
}

.loader-log {
  min-height:
    clamp(
      70px,
      16vh,
      110px
    );

  margin-top:
    clamp(
      8px,
      1.7vh,
      15px
    );

  color: #cbd5e1;

  font-size:
    clamp(
      8px,
      .95vw,
      11px
    );

  line-height: 1.8;
}

.loader-log div::before {
  content: "› ";
  color: #4ade80;
}

.loader-bar {
  position: relative;

  height: 6px;

  margin-top:
    clamp(
      8px,
      1.7vh,
      14px
    );

  overflow: hidden;

  border-radius: 999px;

  background: #172554;
}

.loader-bar::after {
  content: "";

  position: absolute;
  inset: 0;

  width: 35%;

  background:
    linear-gradient(
      90deg,
      #22d3ee,
      #8b5cf6,
      #ec4899
    );

  animation:
    loadingMove
    .72s
    ease-in-out
    infinite alternate;
}

@keyframes loadingMove {
  from {
    transform:
      translateX(-30%);
  }

  to {
    transform:
      translateX(205%);
  }
}


/* ==================================================
   GAME FOOTER
================================================== */

.game-footer {
  height:
    clamp(
      35px,
      6.5vh,
      44px
    );

  padding:
    0
    clamp(
      8px,
      1.3vw,
      15px
    );

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-top:
    1px solid
    rgba(103, 232, 249, .14);

  background:
    rgba(2, 6, 23, .9);

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      9px
    );
}

.controls {
  color: #64748b;
}

.controls strong {
  color: #67e8f9;
}

.game-message {
  color: #fde68a;

  font-size:
    clamp(
      7px,
      .8vw,
      9px
    );

  letter-spacing: 1px;

  text-align: right;
}


/* ==================================================
   COMPACT
================================================== */

@media (max-height: 500px) {

  .profile-content {
    padding-top: 20px;
  }

  .name {
    margin-top: 15px;
  }

  .launch-area {
    margin-top: 17px;
  }

  .orb {
    top: 14%;
  }
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

  .orb {
    right: -50px;
    opacity: .40;
  }

  .profile-content {
    padding-left: 7%;
    padding-right: 7%;
  }

  .runtime-status {
    display: none;
  }

  .game-modal {
    padding: 4px;
  }

  .game-window {
    width: 100%;
    height: 98%;

    border-radius: 8px;
  }

  .controls {
    max-width: 70%;
  }

  .game-message {
    max-width: 28%;
  }
}

@media (max-width: 540px) {

  .game-launch-buttons {
    flex-direction: column;
    align-items: flex-start;
  }

  .game-launch-buttons
  .primary-button {
    width: min(100%, 260px);
  }
}

</style>
</head>

/* ==================================================

function wait(
  milliseconds
) {

  return new Promise(
    resolve => {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );
}


/* ==================================================
   OPEN GAME
================================================== */

async function openGame(
  selectedMode
) {

  if (modalOpen) {
    return;
  }

  gameMode =
    selectedMode;

  modalOpen =
    true;

  app.classList.add(
    "game-open"
  );

  gameModal.classList.add(
    "is-open"
  );

  loadingOverlay.classList.remove(
    "is-hidden"
  );

  loaderLog.innerHTML =
    "";

  if (
    gameMode ===
    "runner"
  ) {

    gameTitle.textContent =
      "ABAP RUNNER";

    gameControls.innerHTML =
      "MOVE: <strong>← → / A D</strong>" +
      "&nbsp;&nbsp;" +
      "JUMP: <strong>SPACE / W / ↑</strong>" +
      "&nbsp;&nbsp;" +
      "RESTART: <strong>R</strong>";

    gameMessage.textContent =
      "INITIALIZING WORLD...";

  } else {

    gameTitle.textContent =
      "ABAP INVADERS";

    gameControls.innerHTML =
      "MOVE: <strong>← → / A D</strong>" +
      "&nbsp;&nbsp;" +
      "SHOOT: <strong>SPACE</strong>" +
      "&nbsp;&nbsp;" +
      "RESTART: <strong>R</strong>";

    gameMessage.textContent =
      "INITIALIZING...";
  }

  const messages =
    gameMode === "runner"
      ? [
          "LOADING DEVELOPMENT LANDSCAPE...",
          "COMPILING PLATFORM DATA...",
          "SPAWNING BUG PROCESSES...",
          "SETTING BREAKPOINT FLAG...",
          "RUN SESSION READY"
        ]
      : [
          "INITIALIZING ABAP RUNTIME...",
          "LOADING BUG TABLE...",
          "ATTACHING DEBUGGER...",
          "ACTIVATING BREAKPOINTS...",
          "DEBUG SESSION READY"
        ];

  for (
    const message
    of messages
  ) {

    if (!modalOpen) {
      return;
    }

    const line =
      document.createElement(
        "div"
      );

    line.textContent =
      message;

    loaderLog.appendChild(
      line
    );

    await wait(
      120
    );
  }

  await wait(
    120
  );

  if (!modalOpen) {
    return;
  }

  if (
    gameMode ===
    "runner"
  ) {

    startRunner();

    gameMessage.textContent =
      "TARGET: REACH PRODUCTION";

  } else {

    startInvaders();

    gameMessage.textContent =
      "TARGET: REMOVE ALL BUGS";
  }

  loadingOverlay.classList.add(
    "is-hidden"
  );

  canvas.focus();
}


/* ==================================================

================================================== */

function hideGame() {

  modalOpen =
    false;

  running =
    false;

  resetKeys();

  app.classList.remove(
    "game-open"
  );

  gameModal.classList.remove(
    "is-open"
  );

  loadingOverlay.classList.remove(
    "is-hidden"
  );

  if (
    gameMode ===
    "runner"
  ) {

    playRunner.focus();

  } else {

    playInvaders.focus();
  }
}


/* ==================================================
   KEYS
================================================== */

function resetKeys() {

  keys.arrowleft =
    false;

  keys.arrowright =
    false;

  keys.arrowup =
    false;

  keys.a =
    false;

  keys.d =
    false;

  keys.w =
    false;
}


/* ==================================================
   INVADERS
================================================== */

function createBugs() {

  bugs =
    [];

  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let col = 0;
      col < 6;
      col++
    ) {

      bugs.push({

        x:
          72 +
          col * 92,

        y:
          50 +
          row * 42,

        width:
          38,

        height:
          23,

        direction:
          row % 2 === 0
            ? 1
            : -1,

        speed:
          .42 +
          row * .07,

        dead:
          false

      });
    }
  }
}


function startInvaders() {

  score =
    0;

  bullets =
    [];

  particles =
    [];

  cleared =
    false;

  running =
    true;

  bulletCooldown =
    false;

  player.x =
    292;

  scoreElement.textContent =
    "SCORE 0000";

  createBugs();
}


function shoot() {

  if (
    !modalOpen ||
    !running ||
    bulletCooldown
  ) {
    return;
  }

  bulletCooldown =
    true;

  bullets.push({

    x:
      player.x +
      player.width / 2 -
      2,

    y:
      player.y - 16,

    width:
      4,

    height:
      14,

    speed:
      7.5,

    dead:
      false

  });

  setTimeout(
    () => {

      bulletCooldown =
        false;

    },
    170
  );
}


function updateInvaders() {

  if (
    keys.arrowleft ||
    keys.a
  ) {

    player.x -=
      player.speed;
  }

  if (
    keys.arrowright ||
    keys.d
  ) {

    player.x +=
      player.speed;
  }

  player.x =
    Math.max(
      0,
      Math.min(
        canvas.width -
        player.width,
        player.x
      )
    );

  for (
    const bullet
    of bullets
  ) {

    bullet.y -=
      bullet.speed;
  }

  bullets =
    bullets.filter(
      bullet =>
        bullet.y > -30 &&
        !bullet.dead
    );

  for (
    const bug
    of bugs
  ) {

    bug.x +=
      bug.direction *
      bug.speed;

    if (
      bug.x <= 10
    ) {

      bug.direction =
        1;
    }

    if (
      bug.x +
      bug.width >=
      canvas.width -
      10
    ) {

      bug.direction =
        -1;
    }
  }

  invadersCollisionCheck();

  updateParticles();

  if (
    bugs.length === 0 &&
    !cleared
  ) {

    cleared =
      true;

    running =
      false;

    gameMessage.textContent =
      "DEBUG COMPLETE // SY-SUBRC = 0";
  }
}


function invadersCollisionCheck() {

  for (
    const bullet
    of bullets
  ) {

    for (
      const bug
      of bugs
    ) {

      if (
        bug.dead ||
        bullet.dead
      ) {
        continue;
      }

      const hit =

        bullet.x <
          bug.x +
          bug.width

        &&

        bullet.x +
          bullet.width >
          bug.x

        &&

        bullet.y <
          bug.y +
          bug.height

        &&

        bullet.y +
          bullet.height >
          bug.y;

      if (hit) {

        bug.dead =
          true;

        bullet.dead =
          true;

        score +=
          100;

        createExplosion(

          bug.x +
          bug.width / 2,

          bug.y +
          bug.height / 2

        );

        break;
      }
    }
  }

  bugs =
    bugs.filter(
      bug =>
        !bug.dead
    );

  bullets =
    bullets.filter(
      bullet =>
        !bullet.dead
    );

  updateScore();
}

function createRunnerEnemy(
  x,
  y

  return {

    x,
    y,

    width: 30,

    height: 28,

    vx: -1,

    dead: false

  };

/* ==================================================
   RUNNER JUMP
================================================== */

function runnerJump() {

  if (
    !modalOpen ||
    !running ||
    !runnerPlayer.onGround
  ) {
    return;
  }

  runnerPlayer.vy =
    -runnerPlayer.jumpPower;

  runnerPlayer.onGround =
    false;
}


/* ==================================================
   RUNNER UPDATE
================================================== */

function updateRunner() {

  const previousY =
    runnerPlayer.y;

  if (
    keys.arrowleft ||
    keys.a
  ) {

    runnerPlayer.vx -=
      runnerPlayer.speed;

    runnerPlayer.direction =
      -1;

  } else if (
    keys.arrowright ||
    keys.d
  ) {

    runnerPlayer.vx +=
      runnerPlayer.speed;

    runnerPlayer.direction =
      1;

  } else {

    runnerPlayer.vx *=
      .78;
  }

  runnerPlayer.vx =
    Math.max(
      -runnerPlayer.maxSpeed,
      Math.min(
        runnerPlayer.maxSpeed,
        runnerPlayer.vx
      )
    );

  runnerPlayer.vy +=
    runnerWorld.gravity;

  runnerPlayer.vy =
    Math.min(
      runnerPlayer.vy,
      13
    );

  runnerPlayer.x +=
    runnerPlayer.vx;

  runnerPlayer.y +=
    runnerPlayer.vy;

  runnerPlayer.x =
    Math.max(
      0,
      Math.min(
        runnerWorld.width -
        runnerPlayer.width,
        runnerPlayer.x
      )
    );

  runnerPlayer.onGround =
    false;

  for (
    const platform
    of runnerPlatforms
  ) {

    const horizontalHit =
      runnerPlayer.x +
      runnerPlayer.width >
        platform.x
      &&
      runnerPlayer.x <
        platform.x +
        platform.width;

    const previousBottom =
      previousY +
      runnerPlayer.height;

    const currentBottom =
      runnerPlayer.y +
      runnerPlayer.height;

    if (
      horizontalHit &&
      runnerPlayer.vy >= 0 &&
      previousBottom <=
        platform.y + 8 &&
      currentBottom >=
        platform.y
    ) {

      runnerPlayer.y =
        platform.y -
        runnerPlayer.height;

      runnerPlayer.vy =
        0;

      runnerPlayer.onGround =
        true;
    }
  }

  updateRunnerEnemies();

  updateRunnerCoins();

  updateParticles();

  if (
    runnerPlayer.y >
    canvas.height + 90
  ) {

    respawnRunner(
      "RUNTIME ERROR // -100"
    );
  }

  const desiredCameraX =
    runnerPlayer.x -
    canvas.width *
    .34;

  runnerCameraX +=
    (
      desiredCameraX -
      runnerCameraX
    ) *
    .1;

  runnerCameraX =
    Math.max(
      0,
      Math.min(
        runnerWorld.width -
        canvas.width,
        runnerCameraX
      )
    );

  if (
    runnerPlayer.x >
      runnerWorld.width -
      150 &&
    !runnerGoalReached
  ) {

    runnerGoalReached =
      true;

    cleared =
      true;

    running =
      false;

    score +=
      1000;

    updateScore();

    gameMessage.textContent =
      "TRANSPORT COMPLETE // PRODUCTION";
  }
}


function respawnRunner(
  message
) {

  runnerPlayer.x =
    Math.max(
      80,
      runnerPlayer.x -
      240
    );

  runnerPlayer.y =
    190;

  runnerPlayer.vx =
    0;

  runnerPlayer.vy =
    0;

  score =
    Math.max(
      0,
      score - 100
    );

  updateScore();

  gameMessage.textContent =
    message;
}


/* ==================================================
   RUNNER ENEMIES
================================================== */

function updateRunnerEnemies() {

  for (
    const enemy
    of runnerEnemies
  ) {

    if (enemy.dead) {
      continue;
    }

    enemy.x +=
      enemy.vx;

    const hit =
      runnerPlayer.x <
        enemy.x +
        enemy.width
      &&
      runnerPlayer.x +
        runnerPlayer.width >
        enemy.x
      &&
      runnerPlayer.y <
        enemy.y +
        enemy.height
      &&
      runnerPlayer.y +
        runnerPlayer.height >
        enemy.y;

    if (!hit) {
      continue;
    }

    const playerBottom =
      runnerPlayer.y +
      runnerPlayer.height;

    const stomp =
      runnerPlayer.vy > 0 &&
      playerBottom <
        enemy.y +
        enemy.height *
        .78;

    if (stomp) {

      enemy.dead =
        true;

      runnerPlayer.vy =
        -7;

      score +=
        200;

      createExplosion(

        enemy.x -
        runnerCameraX +
        enemy.width / 2,

        enemy.y +
        enemy.height / 2

      );

      gameMessage.textContent =
        "BUG FIXED // +200";

    } else {

      respawnRunner(
        "SHORT DUMP // -100"
      );
    }
  }

  runnerEnemies =
    runnerEnemies.filter(
      enemy =>
        !enemy.dead
    );

  updateScore();
}


/* ==================================================
   RUNNER COINS
================================================== */

function updateRunnerCoins() {

  for (
    const coin
    of runnerCoins
  ) {

    if (coin.collected) {
      continue;
    }

    const hit =
      runnerPlayer.x <
        coin.x +
        coin.width
      &&
      runnerPlayer.x +
        runnerPlayer.width >
        coin.x
      &&
      runnerPlayer.y <
        coin.y +
        coin.height
      &&
      runnerPlayer.y +
        runnerPlayer.height >
        coin.y;

    if (hit) {

      coin.collected =
        true;

      score +=
        50;

      gameMessage.textContent =
        "CODE FRAGMENT // +50";
    }
  }

  updateScore();
}


/* ==================================================
   SCORE
================================================== */

function updateScore() {

  scoreElement.textContent =

    "SCORE " +

    String(score)
      .padStart(
        4,
        "0"
      );
}


/* ==================================================
   PARTICLES
================================================== */

function createExplosion(
  x,
  y
) {

  for (
    let index = 0;
    index < 6;
    index++
  ) {

    const angle =
      Math.random() *
      Math.PI *
      2;

    const speed =
      .8 +
      Math.random() *
      1.8;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        18 +
        Math.random() *
        12,

      size:
        2 +
        Math.random() *
        2

    });
  }
}


function updateParticles() {

  for (
    const particle
    of particles
  ) {

    particle.x +=
      particle.vx;

    particle.y +=
      particle.vy;

    particle.life -=
      1;
  }

  particles =
    particles.filter(
      particle =>
        particle.life > 0
    );
}


/* ==================================================
   INPUT
================================================== */

window.addEventListener(
  "keydown",
  event => {

    if (!modalOpen) {
      return;
    }

    const key =
      event.key
        .toLowerCase();

    keys[key] =
      true;

    if (
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "Space"
      ].includes(
        event.code
      )
    ) {

      event.preventDefault();
    }

    if (
      event.code === "Space" ||
      key === "w" ||
      key === "arrowup"
    ) {

      if (
        gameMode ===
        "runner"
      ) {

        runnerJump();

      } else if (
        event.code ===
        "Space"
      ) {

        shoot();
      }
    }

    if (
      key === "r"
    ) {

      if (
        gameMode ===
        "runner"
      ) {

        startRunner();

        gameMessage.textContent =
          "TARGET: REACH PRODUCTION";

      } else {

        startInvaders();

        gameMessage.textContent =
          "TARGET: REMOVE ALL BUGS";
      }
    }

    if (
      key === "escape"
    ) {

      hideGame();
    }
  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[
      event.key
        .toLowerCase()
    ] =
      false;
  }
);

    canvas.height

}


function drawBug(
  bug
) {

  ctx.fillStyle =
    "#ec4899";

  ctx.fillRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );

  ctx.strokeStyle =
    "#f9a8d4";

  ctx.strokeRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "10px Consolas";

  ctx.fillText(
    "BUG",
    bug.x + 8,
    bug.y + 15
  );
}


function drawInvadersPlayer() {

  ctx.fillStyle =
    "#22d3ee";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );

  ctx.fillStyle =
    "#67e8f9";

  ctx.fillRect(
    player.x +
      player.width / 2 -
      6,

    player.y - 10,

    12,
    10
  );

  ctx.fillStyle =
    "#020617";

  ctx.font =
    "bold 10px Consolas";

  ctx.fillText(
    "DEV",
    player.x + 17,
    player.y + 14
  );
}


function drawBullets() {

  ctx.fillStyle =
    "#4ade80";

  for (
    const bullet
    of bullets
  ) {

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );
  }
}


/* ==================================================
   PARTICLES DRAW
================================================== */

function drawParticles() {

  for (
    const particle
    of particles
  ) {

    const alpha =
      Math.max(
        0,
        particle.life /
        30
      );

    ctx.fillStyle =
      "rgba(244,114,182," +
      alpha +
      ")";

    ctx.fillRect(
      particle.x,
      particle.y,
      particle.size,
      particle.size
    );
  }
}


/* ==================================================
   INVADERS CLEAR
================================================== */

function drawInvadersClear() {

  ctx.fillStyle =
    "rgba(2,6,23,.92)";

  ctx.fillRect(
    110,
    88,
    420,
    190
  );

  ctx.strokeStyle =
    "#4ade80";

  ctx.lineWidth =
    2;

  ctx.strokeRect(
    110,
    88,
    420,
    190
  );

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#4ade80";

  ctx.font =
    "bold 28px Consolas";

  ctx.fillText(
    "DEBUG COMPLETE",
    canvas.width / 2,
    143
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "14px Consolas";

  ctx.fillText(
    "ALL BUGS REMOVED",
    canvas.width / 2,
    180
  );

  ctx.fillStyle =
    "#fde68a";

  ctx.font =
    "12px Consolas";

  ctx.fillText(
    "SY-SUBRC = 0",
    canvas.width / 2,
    212
  );

  ctx.fillStyle =
    "#94a3b8";

  ctx.font =
    "10px Consolas";

  ctx.fillText(
    "PRESS R TO RESTART",
    canvas.width / 2,
    244
  );

  ctx.textAlign =
    "start";
}


function drawInvaders() {

  clearCanvas();

  drawInvadersHUD();

  for (
    const bug
    of bugs
  ) {

    drawBug(
      bug
    );
  }

  drawBullets();

  drawParticles();

  drawInvadersPlayer();

  if (cleared) {

    drawInvadersClear();
  }
}


/* ==================================================
   RUNNER BACKGROUND
================================================== */

function drawRunnerBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "#07152d"
  );

  gradient.addColorStop(
    1,
    "#10103a"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "rgba(34,211,238,.08)";

  const gridOffset =
    -(
      runnerCameraX *
      .18
    ) % 80;

  for (
    let x = gridOffset;
    x < canvas.width + 80;
    x += 80
  ) {

    ctx.fillRect(
      x,
      0,
      1,
      canvas.height
    );
  }


  ctx.fillStyle =
    "rgba(139,92,246,.12)";

  const cityOffset =
    -(
      runnerCameraX *
      .32
    ) % 110;

  for (
    let index = -1;
    index < 8;
    index++
  ) {

    const buildingX =
      index * 110 +
      cityOffset;

    const buildingHeight =
      55 +
      (
        Math.abs(index) %
        4
      ) *
      22;

    ctx.fillRect(
      buildingX,
      canvas.height -
        buildingHeight -
        54,
      76,
      buildingHeight
    );
  }
}


/* ==================================================
   RUNNER PLATFORMS
================================================== */

function drawRunnerPlatforms() {

  for (
    const platform
    of runnerPlatforms
  ) {

    const screenX =
      platform.x -
      runnerCameraX;

    if (
      screenX >
        canvas.width ||
      screenX +
        platform.width <
        0
    ) {

      continue;
    }

    ctx.fillStyle =
      "#164e63";

    ctx.fillRect(
      screenX,
      platform.y,
      platform.width,
      platform.height
    );

    ctx.fillStyle =
      "#22d3ee";

    ctx.fillRect(
      screenX,
      platform.y,
      platform.width,
      4
    );

    ctx.strokeStyle =
      "rgba(103,232,249,.19)";

    ctx.strokeRect(
      screenX,
      platform.y,
      platform.width,
      platform.height
    );
  }
}


/* ==================================================
   RUNNER PLAYER
================================================== */

function drawRunnerPlayer() {

  const screenX =
    runnerPlayer.x -
    runnerCameraX;

  ctx.fillStyle =
    "#22d3ee";

  ctx.fillRect(
    screenX + 4,
    runnerPlayer.y + 12,
    20,
    24
  );

  ctx.fillStyle =
    "#fde68a";

  ctx.fillRect(
    screenX + 7,
    runnerPlayer.y,
    15,
    14
  );

  ctx.fillStyle =
    "#4338ca";

  ctx.fillRect(
    screenX + 4,
    runnerPlayer.y,
    21,
    5
  );

  ctx.fillStyle =
    "#4ade80";

  ctx.fillRect(
    screenX + 2,
    runnerPlayer.y + 36,
    10,
    6
  );

  ctx.fillRect(
    screenX + 17,
    runnerPlayer.y + 36,
    10,
    6
  );

  ctx.fillStyle =
    "#020617";

  ctx.font =
    "bold 7px Consolas";

  ctx.fillText(
    "DEV",
    screenX + 6,
    runnerPlayer.y + 28
  );
}


/* ==================================================
   RUNNER ENEMY DRAW
================================================== */

function drawRunnerEnemies() {

  for (
    const enemy
    of runnerEnemies
  ) {

    const screenX =
      enemy.x -
      runnerCameraX;

    if (
      screenX < -50 ||
      screenX >
        canvas.width + 50
    ) {

      continue;
    }

    ctx.fillStyle =
      "#ec4899";

    ctx.fillRect(
      screenX,
      enemy.y,
      enemy.width,
      enemy.height
    );

    ctx.strokeStyle =
      "#f9a8d4";

    ctx.strokeRect(
      screenX,
      enemy.y,
      enemy.width,
      enemy.height
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.font =
      "bold 8px Consolas";

    ctx.fillText(
      "BUG",
      screenX + 6,
      enemy.y + 17
    );
  }
}


/* ==================================================
   RUNNER COIN DRAW
================================================== */

function drawRunnerCoins() {

  for (
    const coin
    of runnerCoins
  ) {

    if (coin.collected) {
      continue;
    }

    const screenX =
      coin.x -
      runnerCameraX;

    if (
      screenX < -30 ||
      screenX >
        canvas.width + 30
    ) {

      continue;
    }

    ctx.fillStyle =
      "#fde047";

    ctx.beginPath();

    ctx.arc(
      screenX +
        coin.width / 2,

      coin.y +
        coin.height / 2,

      8,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
      "#854d0e";

    ctx.font =
      "bold 9px Consolas";

    ctx.fillText(
      "C",
      screenX + 5,
      coin.y + 12
    );
  }
}


/* ==================================================
   RUNNER GOAL
================================================== */

function drawRunnerGoal() {

  const screenX =
    runnerWorld.width -
    110 -
    runnerCameraX;

  ctx.fillStyle =
    "#4ade80";

  ctx.fillRect(
    screenX,
    158,
    5,
    148
  );

  ctx.fillStyle =
    "#22d3ee";

  ctx.fillRect(
    screenX + 5,
    158,
    92,
    38
  );

  ctx.fillStyle =
    "#020617";

  ctx.font =
    "bold 11px Consolas";

  ctx.fillText(
    "PRODUCTION",
    screenX + 14,
    182
  );
}


/* ==================================================
   RUNNER HUD
================================================== */

function drawRunnerHUD() {

  ctx.fillStyle =
    "rgba(2,6,23,.78)";

  ctx.fillRect(
    10,
    10,
    220,
    43
  );

  ctx.strokeStyle =
    "rgba(103,232,249,.3)";

  ctx.strokeRect(
    10,
    10,
    220,
    43
  );

  ctx.fillStyle =
    "#67e8f9";

  ctx.font =
    "10px Consolas";

  ctx.fillText(
    "SYSTEM: DEVELOPMENT",
    20,
    27
  );

  const progress =
    Math.min(
      100,
      Math.floor(
        runnerPlayer.x /
        (
          runnerWorld.width -
          150
        ) *
        100
      )
    );

  ctx.fillStyle =
    "#94a3b8";

  ctx.fillText(
    "TRANSPORT: " +
    progress +
    "%",
    20,
    43
  );
}


/* ==================================================
   RUNNER CLEAR
================================================== */

function drawRunnerClear() {

  ctx.fillStyle =
    "rgba(2,6,23,.92)";

  ctx.fillRect(
    100,
    82,
    440,
    198
  );

  ctx.strokeStyle =
    "#4ade80";

  ctx.lineWidth =
    2;

  ctx.strokeRect(
    100,
    82,
    440,
    198
  );

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#4ade80";

  ctx.font =
    "bold 25px Consolas";

  ctx.fillText(
    "TRANSPORT COMPLETE",
    canvas.width / 2,
    139
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "14px Consolas";

  ctx.fillText(
    "DEVELOPMENT → PRODUCTION",
    canvas.width / 2,
    179
  );

  ctx.fillStyle =
    "#fde68a";

  ctx.font =
    "12px Consolas";

  ctx.fillText(
    "RETURN CODE = 0",
    canvas.width / 2,
    214
  );

  ctx.fillStyle =
    "#94a3b8";

  ctx.font =
    "10px Consolas";

  ctx.fillText(
    "PRESS R TO RESTART",
    canvas.width / 2,
    249
  );

  ctx.textAlign =
    "start";
}


/* ==================================================
   RUNNER DRAW
================================================== */

function drawRunner() {

  clearCanvas();

  drawRunnerBackground();

  drawRunnerPlatforms();

  drawRunnerCoins();

  drawRunnerEnemies();

  drawRunnerGoal();

  drawRunnerPlayer();

  drawParticles();

  drawRunnerHUD();

  if (cleared) {

    drawRunnerClear();
  }
}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(
  timestamp
) {

  if (
    modalOpen &&
    !document.hidden
  ) {

    const loaded =
      loadingOverlay
        .classList
        .contains(
          "is-hidden"
        );

    if (
      loaded &&
      timestamp -
      lastFrameTime >=
      16
    ) {

      lastFrameTime =
        timestamp;

      if (
        gameMode ===
        "runner"
      ) {

        if (running) {

          updateRunner();
        }

        drawRunner();

      } else {

        if (running) {

          updateInvaders();
        }

        drawInvaders();
      }
    }
  }

  requestAnimationFrame(
    gameLoop
  );
}


/* ==================================================
   PAGE VISIBILITY
================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      resetKeys();
    }
  }
);


/* ==================================================
   EVENTS
================================================== */

playInvaders.addEventListener(
  "click",
  () => {

    openGame(
      "invaders"
    );
  }
);


playRunner.addEventListener(
  "click",
  () => {

    openGame(
      "runner"
    );
  }
);


closeGame.addEventListener(
  "click",
  hideGame
);


gameModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      gameModal
    ) {

      hideGame();
    }
  }
);


/* ==================================================
   START LOOP
================================================== */

requestAnimationFrame(
  gameLoop
);

</script>

</body>
</html>
