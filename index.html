<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #020617;
  color: white;
  font-family: "Segoe UI", Arial, sans-serif;
}


/* =============================
   PROFILE
============================= */

#profile {
  min-height: 100vh;
  padding: 70px 7%;
  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(139,92,246,.30),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #020617,
      #071426,
      #100b2d
    );
}

.label {
  color: #67e8f9;
  font-family: Consolas, monospace;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 5px;
}

.name {
  margin-top: 45px;
  font-size: clamp(70px, 11vw, 135px);
  font-weight: 1000;
  line-height: .72;
  letter-spacing: -7px;

  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;
}

.role {
  margin-top: 35px;
  font-size: 20px;
  font-weight: bold;
}

.role strong {
  color: #c4b5fd;
}


/* =============================
   PLAY BUTTON
============================= */

#playButton {
  margin-top: 45px;
  padding: 17px 28px;

  border: 1px solid #67e8f9;
  border-radius: 10px;

  background: #0891b2;
  color: white;

  font-family: Consolas, monospace;
  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 16px rgba(34,211,238,.35);
}

#playButton:hover {
  background: #06b6d4;

  box-shadow:
    0 0 30px rgba(34,211,238,.65);
}


/* =============================
   GAME SCREEN
============================= */

#gameScreen {
  display: none;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at center,
      #172554,
      #020617 65%
    );

  text-align: center;

  padding: 25px;
}

.game-header {
  max-width: 900px;
  margin: auto;

  display: flex;
  justify-content: space-between;

  color: #67e8f9;

  font-family: Consolas, monospace;
  font-weight: bold;
}

canvas {
  display: block;

  max-width: 100%;
  margin: 20px auto;

  border: 1px solid #22d3ee;
  border-radius: 10px;

  background: #000814;

  box-shadow:
    0 0 25px rgba(34,211,238,.25);
}

.controls {
  color: #94a3b8;

  font-family: Consolas, monospace;
}

#exitButton {
  margin-top: 18px;

  padding: 10px 20px;

  border: 1px solid #fb7185;
  border-radius: 8px;

  background: transparent;
  color: #fb7185;

  cursor: pointer;
}

</style>
</head>


<body>


<!-- =============================
     PROFILE
============================= -->

<section id="profile">

  <div class="label">
    JOU_DO // DIGITAL DEVELOPER
  </div>

  <div class="name">
    TEPPEI
    <br>
    <span>JOUDO</span>
  </div>

  <div class="role">
    SAP ABAP Developer /
    <strong>AI Explorer</strong>
  </div>

  <button id="playButton">
    ▶ PLAY ABAP INVADERS
  </button>

</section>



<!-- =============================
     GAME
============================= -->

<section id="gameScreen">

  <div class="game-header">

    <span>
      ABAP INVADERS
    </span>

    <span id="score">
      SCORE 0000
    </span>

  </div>


  <canvas
    id="game"
    width="800"
    height="520">
  </canvas>


  <div class="controls">
    MOVE: ← → / A D
    &nbsp;&nbsp;
    SHOOT: SPACE
  </div>


  <button id="exitButton">
    EXIT GAME
  </button>

</section>



<script>

const profile =
  document.getElementById("profile");

const gameScreen =
  document.getElementById("gameScreen");

const playButton =
  document.getElementById("playButton");

const exitButton =
  document.getElementById("exitButton");

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const scoreElement =
  document.getElementById("score");


/* =============================
   GAME STATE
============================= */

let running = false;

let score = 0;

const keys = {};

const player = {
  x: 370,
  y: 465,
  width: 60,
  height: 22,
  speed: 6
};

let bullets = [];

let bugs = [];


/* =============================
   BUG CREATION
============================= */

function createBugs() {

  bugs = [];

  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let col = 0;
      col < 8;
      col++
    ) {

      bugs.push({

        x:
          85 +
          col * 85,

        y:
          70 +
          row * 55,

        width: 42,

        height: 25,

        direction:
          row % 2 === 0
            ? 1
            : -1

      });

    }

  }

}


/* =============================
   START
============================= */

playButton.addEventListener(
  "click",
  () => {

    profile.style.display =
      "none";

    gameScreen.style.display =
      "block";

    startGame();

  }
);


/* =============================
   EXIT
============================= */

exitButton.addEventListener(
  "click",
  () => {

    running = false;

    gameScreen.style.display =
      "none";

    profile.style.display =
      "block";

  }
);


/* =============================
   KEYBOARD
============================= */

window.addEventListener(
  "keydown",
  event => {

    keys[
      event.key.toLowerCase()
    ] = true;


    if (
      event.code === "Space" &&
      running
    ) {

      event.preventDefault();

      shoot();

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }
);


/* =============================
   SHOOT
============================= */

function shoot() {

  bullets.push({

    x:
      player.x +
      player.width / 2 -
      2,

    y:
      player.y - 15,

    width: 4,

    height: 16,

    speed: 9

  });

}


/* =============================
   START GAME
============================= */

function startGame() {

  score = 0;

  bullets = [];

  player.x = 370;

  scoreElement.textContent =
    "SCORE 0000";

  createBugs();

  running = true;

  requestAnimationFrame(
    gameLoop
  );

}


/* =============================
   GAME LOOP
============================= */

function gameLoop() {

  if (!running) {
    return;
  }


  update();

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


/* =============================
   UPDATE
============================= */

function update() {

  /* MOVE LEFT */

  if (
    keys["arrowleft"] ||
    keys["a"]
  ) {

    player.x -=
      player.speed;

  }


  /* MOVE RIGHT */

  if (
    keys["arrowright"] ||
    keys["d"]
  ) {

    player.x +=
      player.speed;

  }


  /* WORLD BOUNDS */

  player.x =
    Math.max(
      0,
      Math.min(
        canvas.width -
        player.width,

        player.x
      )
    );


  /* BULLETS */

  bullets.forEach(
    bullet => {

      bullet.y -=
        bullet.speed;

    }
  );


  bullets =
    bullets.filter(
      bullet =>
        bullet.y >
        -30
    );


  /* BUG MOVEMENT */

  bugs.forEach(
    bug => {

      bug.x +=
        bug.direction *
        0.6;

    }
  );


  /* COLLISION */

  bullets.forEach(
    bullet => {

      bugs.forEach(
        bug => {

          if (
            !bug.dead &&
            bullet.x <
              bug.x +
              bug.width &&
            bullet.x +
              bullet.width >
              bug.x &&
            bullet.y <
              bug.y +
              bug.height &&
            bullet.y +
              bullet.height >
              bug.y
          ) {

            bug.dead =
              true;

            bullet.dead =
              true;

            score +=
              100;

          }

        }
      );

    }
  );


  bugs =
    bugs.filter(
      bug =>
        !bug.dead
    );


  bullets =
    bullets.filter(
      bullet =>
        !bullet.dead
    );


  scoreElement.textContent =
    "SCORE " +
    String(score)
      .padStart(4, "0");


  /* CLEAR */

  if (
    bugs.length === 0
  ) {

    running = false;

    draw();

    showClear();

  }

}


/* =============================
   DRAW
============================= */

function draw() {

  ctx.fillStyle =
    "#000814";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* GRID */

  ctx.strokeStyle =
    "rgba(34,211,238,.06)";

  ctx.lineWidth = 1;

  for (
    let x = 0;
    x < canvas.width;
    x += 40
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.height
    );

    ctx.stroke();

  }


  /* BUGS */

  bugs.forEach(
    bug => {

      ctx.fillStyle =
        "#ec4899";

      ctx.fillRect(
        bug.x,
        bug.y,
        bug.width,
        bug.height
      );


      ctx.fillStyle =
        "#ffffff";

      ctx.font =
        "12px Consolas";

      ctx.fillText(
        "BUG",
        bug.x + 8,
        bug.y + 17
      );

    }
  );


  /* BULLETS */

  ctx.fillStyle =
    "#4ade80";

  bullets.forEach(
    bullet => {

      ctx.fillRect(
        bullet.x,
        bullet.y,
        bullet.width,
        bullet.height
      );

    }
  );


  /* PLAYER */

  ctx.fillStyle =
    "#22d3ee";

  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "12px Consolas";

  ctx.fillText(
    "DEV",
    player.x + 17,
    player.y + 16
  );

}


/* =============================
   CLEAR
============================= */

function showClear() {

  ctx.fillStyle =
    "rgba(2,6,23,.80)";

  ctx.fillRect(
    150,
    190,
    500,
    150
  );


  ctx.fillStyle =
    "#4ade80";

  ctx.font =
    "bold 42px Consolas";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "DEBUG COMPLETE",
    canvas.width / 2,
    250
  );


  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "18px Consolas";

  ctx.fillText(
    "ALL BUGS REMOVED",
    canvas.width / 2,
    290
  );


  ctx.textAlign =
    "start";

}

</script>

</body>
</html>
