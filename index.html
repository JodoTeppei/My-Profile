<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO | ABAP INVADERS</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #020617;
  color: #ffffff;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}

button {
  font: inherit;
}

.app {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #020617;
}


/* ==================================================
   PROFILE
================================================== */

.profile {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 77% 36%,
      rgba(139, 92, 246, .30),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(236, 72, 153, .14),
      transparent 25%
    ),
    linear-gradient(
      145deg,
      #020617,
      #071426 52%,
      #100b2d
    );

  transition:
    filter .3s ease,
    transform .3s ease;
}

/*
  blur()は使わない。
  ゲーム開始時は暗くして少しだけ拡大する。
*/

.app.game-open .profile {
  filter: brightness(.38);
  transform: scale(1.01);
}


/* ==================================================
   PROFILE ANIMATION PAUSE
================================================== */

/*
  ゲーム中は背面アニメーションをすべて停止する。
*/

.app.game-open .signal,
.app.game-open .orb,
.app.game-open .orb::before,
.app.game-open .orb::after,
.app.game-open .system-status::before {
  animation-play-state: paused;
}


/* ==================================================
   MOVING SIGNALS
================================================== */

.signals {
  position: absolute;
  inset: 0;

  overflow: hidden;

  pointer-events: none;
}

.signal {
  position: absolute;

  bottom: -24%;

  width:
    clamp(
      2px,
      .25vw,
      4px
    );

  border-radius: 999px;

  opacity: .62;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #22d3ee,
      #818cf8,
      #ec4899,
      transparent
    );

  box-shadow:
    0 0 6px rgba(34, 211, 238, .8);

  animation:
    signalMove 4s
    ease-in-out
    infinite alternate;
}

@keyframes signalMove {

  from {
    transform:
      translateY(22vh);

    opacity: .20;
  }

  50% {
    opacity: .82;
  }

  to {
    transform:
      translateY(-28vh);

    opacity: .36;
  }

}

.signal:nth-child(2n) {
  animation-duration: 5.2s;
}

.signal:nth-child(3n) {
  animation-duration: 3.1s;
}

.signal:nth-child(4n) {
  animation-delay: -1.5s;
}

.signal:nth-child(5n) {
  animation-delay: -2.5s;
}


/* ==================================================
   PROFILE GRID
================================================== */

.profile-grid {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(103, 232, 249, .06) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(103, 232, 249, .06) 1px,
      transparent 1px
    );

  background-size:
    clamp(28px, 4vw, 48px)
    clamp(28px, 4vw, 48px);
}


/* ==================================================
   PROFILE OVERLAY
================================================== */

.profile-overlay {
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(2, 6, 23, .96) 0%,
      rgba(2, 6, 23, .77) 38%,
      rgba(2, 6, 23, .31) 68%,
      rgba(2, 6, 23, .08) 100%
    );
}


/* ==================================================
   AI ORB
================================================== */

.orb {
  position: absolute;

  right: 9%;
  top: 18%;

  width:
    clamp(
      110px,
      17vw,
      205px
    );

  aspect-ratio: 1;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ecfeff 0,
      #22d3ee 13%,
      #2563eb 38%,
      #7c3aed 66%,
      #020617 77%
    );

  box-shadow:
    0 0 20px rgba(34, 211, 238, .9),
    0 0 55px rgba(124, 58, 237, .55);

  animation:
    orbFloat 3.3s
    ease-in-out
    infinite alternate;
}

@keyframes orbFloat {

  from {
    transform:
      translateY(-10px)
      scale(.98);
  }

  to {
    transform:
      translateY(10px)
      scale(1.02);
  }

}

.orb::before {
  content: "";

  position: absolute;
  inset: -13%;

  border:
    1px dashed
    rgba(103, 232, 249, .52);

  border-radius: 50%;

  animation:
    spin 12s
    linear
    infinite;
}

.orb::after {
  content: "";

  position: absolute;
  inset: 19%;

  border:
    1px solid
    rgba(255, 255, 255, .30);

  border-radius: 50%;

  animation:
    spinReverse 6s
    linear
    infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

@keyframes spinReverse {

  to {
    transform: rotate(-360deg);
  }

}


/* ==================================================
   BACKGROUND TYPE
================================================== */

.back-type {
  position: absolute;

  right: -1%;
  bottom: -2%;

  color:
    rgba(255, 255, 255, .035);

  font-size:
    clamp(
      90px,
      14vw,
      180px
    );

  font-weight: 1000;
  line-height: .72;
  letter-spacing: -.07em;
  text-align: right;

  pointer-events: none;
}


/* ==================================================
   PROFILE CONTENT
================================================== */

.profile-content {
  position: relative;
  z-index: 10;

  padding:
    clamp(24px, 5vh, 60px)
    6%;
}

.eyebrow {
  color: #67e8f9;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      8px,
      1vw,
      11px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      3px,
      .5vw,
      6px
    );
}

.name {
  margin-top:
    clamp(
      18px,
      4.5vh,
      44px
    );

  font-size:
    clamp(
      52px,
      10vw,
      130px
    );

  line-height: .69;

  font-weight: 1000;

  letter-spacing:
    clamp(
      -8px,
      -.5vw,
      -3px
    );

  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;

  text-shadow:
    4px 4px 0 rgba(67, 56, 202, .82),
    0 0 20px rgba(34, 211, 238, .22);
}


/* ==================================================
   PLAY BUTTON
================================================== */

.launch-area {
  margin-top:
    clamp(
      22px,
      5vh,
      46px
    );
}

.primary-button {
  padding:
    clamp(
      10px,
      1.4vh,
      15px
    )
    clamp(
      16px,
      2.3vw,
      26px
    );

  border:
    1px solid #67e8f9;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #0891b2,
      #4338ca
    );

  color: #ffffff;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      10px,
      1.15vw,
      14px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      1px,
      .2vw,
      2px
    );

  cursor: pointer;

  box-shadow:
    0 0 14px
    rgba(34, 211, 238, .28);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.primary-button:hover {
  transform:
    translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #7c3aed
    );

  box-shadow:
    0 0 24px
    rgba(34, 211, 238, .5);
}

.primary-button:focus-visible {
  outline:
    3px solid
    rgba(103, 232, 249, .7);

  outline-offset: 4px;
}

.launch-note {
  margin-top: 9px;

  color: #64748b;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      10px
    );

  letter-spacing: 2px;
}


/* ==================================================
   STATUS
================================================== */

.system-status {
  position: absolute;

  right: 3%;
  bottom: 4%;

  z-index: 12;

  color: #4ade80;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      10px
    );

  font-weight: 700;

  letter-spacing: 3px;
}

.system-status::before {
  content: "●";

  display: inline-block;

  margin-right: 7px;

  animation:
    statusBlink
    .8s
    step-end
    infinite;
}

@keyframes statusBlink {

  50% {
    opacity: .2;
  }

}


/* ==================================================
   GAME MODAL
================================================== */

.game-modal {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    clamp(
      6px,
      1.2vw,
      14px
    );

  visibility: hidden;
  opacity: 0;
  pointer-events: none;

  background:
    rgba(2, 6, 23, .76);

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.game-modal.is-open {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}


/* ==================================================
   GAME WINDOW
================================================== */

.game-window {
  position: relative;

  width:
    min(
      96%,
      980px
    );

  height: 94%;

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .48);

  border-radius:
    clamp(
      8px,
      1.3vw,
      16px
    );

  background:
    linear-gradient(
      145deg,
      rgba(0, 8, 20, .98),
      rgba(15, 7, 35, .98)
    );

  box-shadow:
    0 0 25px
    rgba(34, 211, 238, .20),
    0 20px 60px
    rgba(0, 0, 0, .65);

  transform:
    scale(.94)
    translateY(10px);

  transition:
    transform .25s ease;
}

.game-modal.is-open
.game-window {
  transform:
    scale(1)
    translateY(0);
}

.game-window::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 2px;

  z-index: 4;

  background:
    linear-gradient(
      90deg,
      transparent,
      #22d3ee,
      #8b5cf6,
      #ec4899,
      transparent
    );
}


/* ==================================================
   GAME HEADER
================================================== */

.game-header {
  height:
    clamp(
      35px,
      7vh,
      48px
    );

  padding:
    0
    clamp(
      9px,
      1.4vw,
      16px
    );

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom:
    1px solid
    rgba(103, 232, 249, .16);

  background:
    rgba(2, 6, 23, .92);

  font-family:
    Consolas,
    "Courier New",
    monospace;
}

.game-header-left {
  display: flex;
  align-items: center;

  gap:
    clamp(
      6px,
      1vw,
      12px
    );
}

.game-title {
  color: #67e8f9;

  font-size:
    clamp(
      9px,
      1.2vw,
      14px
    );

  font-weight: 900;

  letter-spacing:
    clamp(
      1px,
      .25vw,
      3px
    );
}

.runtime-status {
  color: #4ade80;

  font-size:
    clamp(
      6px,
      .65vw,
      8px
    );

  letter-spacing: 2px;
}

.score {
  color: #4ade80;

  font-size:
    clamp(
      9px,
      1.2vw,
      14px
    );

  font-weight: 900;
}

.close-button {
  width:
    clamp(
      25px,
      2.8vw,
      32px
    );

  height:
    clamp(
      25px,
      2.8vw,
      32px
    );

  margin-left: 10px;

  border:
    1px solid
    rgba(251, 113, 133, .5);

  border-radius: 7px;

  background:
    rgba(127, 29, 29, .18);

  color: #fb7185;

  font-size:
    clamp(
      15px,
      1.7vw,
      19px
    );

  line-height: 1;

  cursor: pointer;
}

.close-button:hover {
  color: #ffffff;
  background: #be123c;
}


/* ==================================================
   GAME BODY
================================================== */

.game-body {
  position: relative;

  height:
    calc(
      100% -
      clamp(
        70px,
        14vh,
        92px
      )
    );

  padding:
    clamp(
      4px,
      .8vh,
      8px
    )
    clamp(
      6px,
      1.1vw,
      11px
    );
}

.game-shell {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .25);

  border-radius: 8px;

  background-color: #000814;

  background-image:
    linear-gradient(
      rgba(34, 211, 238, .065) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(34, 211, 238, .065) 1px,
      transparent 1px
    );

  background-size:
    32px 32px;
}

canvas {
  display: block;

  width: 100%;
  height: 100%;

  background: transparent;

  image-rendering: auto;

  outline: none;
}


/* ==================================================
   LOADING
================================================== */

.loading-overlay {
  position: absolute;

  inset:
    clamp(
      4px,
      .8vh,
      8px
    )
    clamp(
      6px,
      1.1vw,
      11px
    );

  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background:
    rgba(0, 8, 20, .98);

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.loading-overlay.is-hidden {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.loader-panel {
  width:
    min(
      86%,
      560px
    );

  padding:
    clamp(
      14px,
      2.5vh,
      24px
    );

  border:
    1px solid
    rgba(103, 232, 249, .3);

  border-radius: 12px;

  background:
    rgba(2, 6, 23, .93);

  font-family:
    Consolas,
    "Courier New",
    monospace;
}

.loader-title {
  color: #67e8f9;

  font-size:
    clamp(
      8px,
      .95vw,
      11px
    );

  font-weight: 700;

  letter-spacing:
    clamp(
      2px,
      .3vw,
      4px
    );
}

.loader-log {
  min-height:
    clamp(
      70px,
      16vh,
      110px
    );

  margin-top:
    clamp(
      8px,
      1.7vh,
      15px
    );

  color: #cbd5e1;

  font-size:
    clamp(
      8px,
      .95vw,
      11px
    );

  line-height: 1.8;
}

.loader-log div::before {
  content: "› ";
  color: #4ade80;
}

.loader-bar {
  position: relative;

  height: 6px;

  margin-top:
    clamp(
      8px,
      1.7vh,
      14px
    );

  overflow: hidden;

  border-radius: 999px;

  background: #172554;
}

.loader-bar::after {
  content: "";

  position: absolute;
  inset: 0;

  width: 35%;

  background:
    linear-gradient(
      90deg,
      #22d3ee,
      #8b5cf6,
      #ec4899
    );

  animation:
    loadingMove
    .72s
    ease-in-out
    infinite alternate;
}

@keyframes loadingMove {

  from {
    transform:
      translateX(-30%);
  }

  to {
    transform:
      translateX(205%);
  }

}


/* ==================================================
   GAME FOOTER
================================================== */

.game-footer {
  height:
    clamp(
      35px,
      6.5vh,
      44px
    );

  padding:
    0
    clamp(
      8px,
      1.3vw,
      15px
    );

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-top:
    1px solid
    rgba(103, 232, 249, .14);

  background:
    rgba(2, 6, 23, .9);

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    clamp(
      7px,
      .8vw,
      9px
    );
}

.controls {
  color: #64748b;
}

.controls strong {
  color: #67e8f9;
}

.game-message {
  color: #fde68a;

  font-size:
    clamp(
      7px,
      .8vw,
      9px
    );

  letter-spacing: 1px;
}


/* ==================================================
   COMPACT
================================================== */

@media (max-height: 500px) {

  .profile-content {
    padding-top: 20px;
  }

  .name {
    margin-top: 15px;
  }

  .launch-area {
    margin-top: 17px;
  }

  .orb {
    top: 14%;
  }

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

  .orb {
    right: -50px;
    opacity: .40;
  }

  .profile-content {
    padding-left: 7%;
    padding-right: 7%;
  }

  .runtime-status {
    display: none;
  }

  .game-modal {
    padding: 4px;
  }

  .game-window {
    width: 100%;
    height: 98%;
    border-radius: 8px;
  }

  .controls {
    max-width: 65%;
  }

}

</style>
</head>

          id="loadingOverlay">


          <div class="loader-panel">


            <div class="loader-title">
              INITIALIZING DEBUG ENVIRONMENT
            </div>


            <div
              class="loader-log"
              id="loaderLog">
            </div>


            <div class="loader-bar"></div>


          </div>


        </div>


      </div>


      <footer class="game-footer">


        <div class="controls">

          MOVE:
          <strong>
            ← → / A D
          </strong>

          &nbsp;

          SHOOT:
          <strong>
            SPACE
          </strong>

          &nbsp;

          RESTART:
          <strong>
            R
          </strong>

        </div>


        <div
          class="game-message"
          id="gameMessage">

          TARGET: REMOVE ALL BUGS

        </div>


      </footer>


    </div>


  </section>


</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const app =
  document.getElementById(
    "app"
  );

const playGame =
  document.getElementById(
    "playGame"
  );

const gameModal =
  document.getElementById(
    "gameModal"
  );

const closeGame =
  document.getElementById(
    "closeGame"
  );

const loadingOverlay =
  document.getElementById(
    "loadingOverlay"
  );

const loaderLog =
  document.getElementById(
    "loaderLog"
  );

const gameMessage =
  document.getElementById(
    "gameMessage"
  );

const canvas =
  document.getElementById(
    "game"
  );

const ctx =
  canvas.getContext(
    "2d",
    {
      alpha: true
    }
  );

const scoreElement =
  document.getElementById(
    "score"
  );


/* ==================================================
   STATE
================================================== */

const keys = {};

let running =
  false;

let modalOpen =
  false;

let cleared =
  false;

let score =
  0;

let bullets =
  [];

let bugs =
  [];

let particles =
  [];

let bulletCooldown =
  false;

let lastFrameTime =
  0;


/* ==================================================
   PLAYER
================================================== */

const player = {

  x: 292,

  y: 315,

  width: 56,

  height: 20,

  speed: 4.6

};


/* ==================================================
   UTILITY
================================================== */

function wait(
  milliseconds
) {

  return new Promise(
    resolve => {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


/* ==================================================
   OPEN GAME
================================================== */

async function openGame() {

  if (modalOpen) {
    return;
  }


  modalOpen =
    true;


  app.classList.add(
    "game-open"
  );


  gameModal.classList.add(
    "is-open"
  );


  loadingOverlay.classList.remove(
    "is-hidden"
  );


  loaderLog.innerHTML =
    "";


  gameMessage.textContent =
    "INITIALIZING...";


  const messages = [

    "INITIALIZING ABAP RUNTIME...",

    "LOADING BUG TABLE...",

    "ATTACHING DEBUGGER...",

    "ACTIVATING BREAKPOINTS...",

    "DEBUG SESSION READY"

  ];


  for (
    const message
    of messages
  ) {

    if (!modalOpen) {
      return;
    }


    const line =
      document.createElement(
        "div"
      );


    line.textContent =
      message;


    loaderLog.appendChild(
      line
    );


    await wait(
      150
    );

  }


  await wait(
    150
  );


  if (!modalOpen) {
    return;
  }


  startGame();


  loadingOverlay.classList.add(
    "is-hidden"
  );


  gameMessage.textContent =
    "TARGET: REMOVE ALL BUGS";


  canvas.focus();

}


/* ==================================================
   CLOSE GAME
================================================== */

function hideGame() {

  modalOpen =
    false;

  running =
    false;


  keys.arrowleft =
    false;

  keys.arrowright =
    false;

  keys.a =
    false;

  keys.d =
    false;


  app.classList.remove(
    "game-open"
  );


  gameModal.classList.remove(
    "is-open"
  );


  loadingOverlay.classList.remove(
    "is-hidden"
  );


  playGame.focus();

}


/* ==================================================
   BUGS
================================================== */

function createBugs() {

  bugs =
    [];


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let col = 0;
      col < 6;
      col++
    ) {

      bugs.push({

        x:
          72 +
          col * 92,

        y:
          50 +
          row * 42,

        width:
          38,

        height:
          23,

        direction:
          row % 2 === 0
            ? 1
            : -1,

        speed:
          .42 +
          row * .07,

        dead:
          false

      });

    }

  }

}


/* ==================================================
   START GAME
================================================== */

function startGame() {

  score =
    0;

  bullets =
    [];

  particles =
    [];

  cleared =
    false;

  running =
    true;

  bulletCooldown =
    false;

  player.x =
    292;

  scoreElement.textContent =
    "SCORE 0000";

  createBugs();

}


/* ==================================================
   INPUT
================================================== */

window.addEventListener(
  "keydown",
  event => {

    if (!modalOpen) {
      return;
    }


    const key =
      event.key
        .toLowerCase();


    keys[key] =
      true;


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      shoot();

    }


    if (
      key === "r" &&
      cleared
    ) {

      startGame();

      gameMessage.textContent =
        "TARGET: REMOVE ALL BUGS";

    }


    if (
      key === "escape"
    ) {

      hideGame();

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[
      event.key
        .toLowerCase()
    ] =
      false;

  }
);


/* ==================================================
   SHOOT
================================================== */

function shoot() {

  if (
    !modalOpen ||
    !running ||
    bulletCooldown
  ) {
    return;
  }


  bulletCooldown =
    true;


  bullets.push({

    x:
      player.x +
      player.width / 2 -
      2,

    y:
      player.y - 16,

    width:
      4,

    height:
      14,

    speed:
      7.5,

    dead:
      false

  });


  setTimeout(
    () => {

      bulletCooldown =
        false;

    },
    170
  );

}


/* ==================================================
   PARTICLES
================================================== */

function createExplosion(
  x,
  y
) {

  for (
    let index = 0;
    index < 6;
    index++
  ) {

    const angle =
      Math.random() *
      Math.PI *
      2;


    const speed =
      .8 +
      Math.random() *
      1.8;


    particles.push({

      x,
      y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        18 +
        Math.random() *
        12,

      size:
        2 +
        Math.random() *
        2

    });

  }

}


/* ==================================================
   UPDATE
================================================== */

function update() {

  if (
    keys.arrowleft ||
    keys.a
  ) {

    player.x -=
      player.speed;

  }


  if (
    keys.arrowright ||
    keys.d
  ) {

    player.x +=
      player.speed;

  }


  player.x =
    Math.max(
      0,
      Math.min(
        canvas.width -
        player.width,
        player.x
      )
    );


  for (
    const bullet
    of bullets
  ) {

    bullet.y -=
      bullet.speed;

  }


  bullets =
    bullets.filter(
      bullet =>
        bullet.y > -30 &&
        !bullet.dead
    );


  for (
    const bug
    of bugs
  ) {

    bug.x +=
      bug.direction *
      bug.speed;


    if (
      bug.x <= 10
    ) {

      bug.direction =
        1;

    }


    if (
      bug.x +
      bug.width >=
      canvas.width -
      10
    ) {

      bug.direction =
        -1;

    }

  }


  collisionCheck();


  for (
    const particle
    of particles
  ) {

    particle.x +=
      particle.vx;

    particle.y +=
      particle.vy;

    particle.life -=
      1;

  }


  particles =
    particles.filter(
      particle =>
        particle.life > 0
    );


  if (
    bugs.length === 0 &&
    !cleared
  ) {

    cleared =
      true;

    running =
      false;

    gameMessage.textContent =
      "DEBUG COMPLETE // SY-SUBRC = 0";

  }

}


/* ==================================================
   COLLISION
================================================== */

function collisionCheck() {

  for (
    const bullet
    of bullets
  ) {

    for (
      const bug
      of bugs
    ) {

      if (
        bug.dead ||
        bullet.dead
      ) {
        continue;
      }


      const hit =

        bullet.x <
          bug.x +
          bug.width

        &&

        bullet.x +
          bullet.width >
          bug.x

        &&

        bullet.y <
          bug.y +
          bug.height

        &&

        bullet.y +
          bullet.height >
          bug.y;


      if (hit) {

        bug.dead =
          true;

        bullet.dead =
          true;

        score +=
          100;


        createExplosion(

          bug.x +
          bug.width / 2,

          bug.y +
          bug.height / 2

        );


        break;

      }

    }

  }


  bugs =
    bugs.filter(
      bug =>
        !bug.dead
    );


  bullets =
    bullets.filter(
      bullet =>
        !bullet.dead
    );


  scoreElement.textContent =

    "SCORE " +

    String(score)
      .padStart(
        4,
        "0"
      );

}


/* ==================================================
   CLEAR CANVAS
================================================== */

function clearCanvas() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* ==================================================
   HUD
================================================== */

function drawHUD() {

  ctx.fillStyle =
    "#67e8f9";

  ctx.font =
    "10px Consolas";

  ctx.fillText(
    "RUNTIME: ACTIVE",
    14,
    19
  );


  ctx.fillStyle =
    "#64748b";

  ctx.fillText(
    "TARGET: REMOVE ALL BUGS",
    14,
    35
  );

}


/* ==================================================
   BUG
================================================== */

function drawBug(
  bug
) {

  ctx.fillStyle =
    "#ec4899";


  ctx.fillRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );


  ctx.strokeStyle =
    "#f9a8d4";


  ctx.strokeRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "10px Consolas";


  ctx.fillText(
    "BUG",
    bug.x + 8,
    bug.y + 15
  );

}


/* ==================================================
   PLAYER
================================================== */

function drawPlayer() {

  ctx.fillStyle =
    "#22d3ee";


  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  ctx.fillStyle =
    "#67e8f9";


  ctx.fillRect(
    player.x +
      player.width / 2 -
      6,

    player.y - 10,

    12,
    10
  );


  ctx.fillStyle =
    "#020617";


  ctx.font =
    "bold 10px Consolas";


  ctx.fillText(
    "DEV",
    player.x + 17,
    player.y + 14
  );

}


/* ==================================================
   BULLETS
================================================== */

function drawBullets() {

  ctx.fillStyle =
    "#4ade80";


  for (
    const bullet
    of bullets
  ) {

    ctx.fillRect(
      bullet.x,
      bullet.y,
      bullet.width,
      bullet.height
    );

  }

}


/* ==================================================
   PARTICLES
================================================== */

function drawParticles() {

  for (
    const particle
    of particles
  ) {

    const alpha =
      Math.max(
        0,
        particle.life /
        30
      );


    ctx.fillStyle =
      "rgba(244,114,182," +
      alpha +
      ")";


    ctx.fillRect(
      particle.x,
      particle.y,
      particle.size,
      particle.size
    );

  }

}


/* ==================================================
   CLEAR SCREEN
================================================== */

function drawClear() {

  ctx.fillStyle =
    "rgba(2,6,23,.92)";


  ctx.fillRect(
    110,
    88,
    420,
    190
  );


  ctx.strokeStyle =
    "#4ade80";


  ctx.lineWidth =
    2;


  ctx.strokeRect(
    110,
    88,
    420,
    190
  );


  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "#4ade80";


  ctx.font =
    "bold 28px Consolas";


  ctx.fillText(
    "DEBUG COMPLETE",
    canvas.width / 2,
    143
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "14px Consolas";


  ctx.fillText(
    "ALL BUGS REMOVED",
    canvas.width / 2,
    180
  );


  ctx.fillStyle =
    "#fde68a";


  ctx.font =
    "12px Consolas";


  ctx.fillText(
    "SY-SUBRC = 0",
    canvas.width / 2,
    212
  );


  ctx.fillStyle =
    "#94a3b8";


  ctx.font =
    "10px Consolas";


  ctx.fillText(
    "PRESS R TO RESTART",
    canvas.width / 2,
    244
  );


  ctx.textAlign =
    "start";

}


/* ==================================================
   DRAW
================================================== */

function draw() {

  clearCanvas();

  drawHUD();


  for (
    const bug
    of bugs
  ) {

    drawBug(
      bug
    );

  }


  drawBullets();

  drawParticles();

  drawPlayer();


  if (cleared) {

    drawClear();

  }

}


/* ==================================================
   LOOP
================================================== */

function gameLoop(
  timestamp
) {

  if (
    modalOpen &&
    !document.hidden
  ) {

    const loaded =
      loadingOverlay
        .classList
        .contains(
          "is-hidden"
        );


    /*
      最大60FPS。
      iframe先で負荷が高い場合にフレーム暴走を防ぐ。
    */

    if (
      loaded &&
      timestamp -
      lastFrameTime >=
      16
    ) {

      lastFrameTime =
        timestamp;


      if (running) {

        update();

      }


      draw();

    }

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* ==================================================
   PAGE VISIBILITY
================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      keys.arrowleft =
        false;

      keys.arrowright =
        false;

      keys.a =
        false;

      keys.d =
        false;

    }

  }
);


/* ==================================================
   EVENTS
================================================== */

playGame.addEventListener(
  "click",
  openGame
);


closeGame.addEventListener(
  "click",
  hideGame
);


gameModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      gameModal
    ) {

      hideGame();

    }

  }
);


/* ==================================================
   START LOOP
================================================== */

requestAnimationFrame(
  gameLoop
);

</script>


</body>
</html>
