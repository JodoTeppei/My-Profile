<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEPPEI JOUDO | ABAP INVADERS</title>

<style>

/* ==================================================
   BASE
================================================== */

* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #020617;
  color: #ffffff;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;
}

button {
  font: inherit;
}

.app {
  position: relative;
  width: 100%;
  height: 620px;
  overflow: hidden;
  background: #020617;
}


/* ==================================================
   PROFILE
================================================== */

.profile {
  position: absolute;
  inset: 0;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 77% 36%,
      rgba(139, 92, 246, .32),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(236, 72, 153, .16),
      transparent 25%
    ),
    linear-gradient(
      145deg,
      #020617,
      #071426 52%,
      #100b2d
    );

  transition:
    filter .45s ease,
    transform .45s ease;
}

.app.game-open .profile {
  filter:
    blur(7px)
    brightness(.56);

  transform:
    scale(1.025);
}


/* ==================================================
   SIGNALS
================================================== */

.signals {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.signal {
  position: absolute;
  bottom: -110px;
  width: 3px;
  border-radius: 999px;
  opacity: .65;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #22d3ee,
      #818cf8,
      #ec4899,
      transparent
    );

  box-shadow:
    0 0 7px #22d3ee,
    0 0 18px rgba(129, 140, 248, .8);

  animation:
    signalMove 4s
    ease-in-out
    infinite alternate;
}

@keyframes signalMove {
  from {
    transform: translateY(130px);
    opacity: .22;
  }

  50% {
    opacity: .92;
  }

  to {
    transform: translateY(-170px);
    opacity: .4;
  }
}

.signal:nth-child(2n) {
  animation-duration: 5.2s;
}

.signal:nth-child(3n) {
  animation-duration: 3.1s;
}

.signal:nth-child(4n) {
  animation-delay: -1.5s;
}

.signal:nth-child(5n) {
  animation-delay: -2.5s;
}


/* ==================================================
   GRID
================================================== */

.grid {
  position: absolute;
  inset: 0;
  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(103, 232, 249, .07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(103, 232, 249, .07) 1px,
      transparent 1px
    );

  background-size: 44px 44px;
}


/* ==================================================
   PROFILE OVERLAY
================================================== */

.profile-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      rgba(2, 6, 23, .96) 0%,
      rgba(2, 6, 23, .78) 38%,
      rgba(2, 6, 23, .32) 68%,
      rgba(2, 6, 23, .08) 100%
    );
}


/* ==================================================
   AI ORB
================================================== */

.orb {
  position: absolute;
  right: 9%;
  top: 118px;

  width: 205px;
  height: 205px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 28%,
      #ecfeff 0,
      #22d3ee 13%,
      #2563eb 38%,
      #7c3aed 66%,
      #020617 77%
    );

  box-shadow:
    0 0 25px #22d3ee,
    0 0 75px rgba(124, 58, 237, .70);

  animation:
    orbFloat 3.3s
    ease-in-out
    infinite alternate;
}

@keyframes orbFloat {
  from {
    transform:
      translateY(-15px)
      scale(.97);
  }

  to {
    transform:
      translateY(15px)
      scale(1.03);
  }
}

.orb::before {
  content: "";
  position: absolute;
  inset: -28px;

  border:
    2px dashed
    rgba(103, 232, 249, .55);

  border-radius: 50%;

  animation:
    spin 12s
    linear
    infinite;
}

.orb::after {
  content: "";
  position: absolute;
  inset: 39px;

  border:
    1px solid
    rgba(255, 255, 255, .35);

  border-radius: 50%;

  animation:
    spinReverse 5s
    linear
    infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes spinReverse {
  to {
    transform: rotate(-360deg);
  }
}


/* ==================================================
   BACKGROUND TYPE
================================================== */

.back-type {
  position: absolute;
  right: -20px;
  bottom: -10px;

  color:
    rgba(255, 255, 255, .035);

  font-size: 160px;
  font-weight: 1000;
  line-height: .72;
  letter-spacing: -10px;

  text-align: right;
  pointer-events: none;
}


/* ==================================================
   PROFILE CONTENT
================================================== */

.profile-content {
  position: relative;
  z-index: 10;

  padding:
    65px 6%;
}

.eyebrow {
  color: #67e8f9;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 11px;
  font-weight: 700;
  letter-spacing: 6px;
}

.name {
  margin-top: 48px;

  font-size:
    clamp(
      76px,
      11vw,
      135px
    );

  line-height: .69;
  font-weight: 1000;
  letter-spacing: -8px;

  text-shadow:
    7px 6px 0 #312e81,
    -5px -4px 0 #0891b2;
}

.name span {
  color: #67e8f9;

  text-shadow:
    4px 4px 0 rgba(67, 56, 202, .82),
    0 0 22px rgba(34, 211, 238, .25);
}


/* ==================================================
   PLAY BUTTON
================================================== */

.launch-area {
  margin-top: 52px;
}

.primary-button {
  padding:
    16px 27px;

  border:
    1px solid #67e8f9;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #0891b2,
      #4338ca
    );

  color: #ffffff;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;

  cursor: pointer;

  box-shadow:
    0 0 15px
    rgba(34, 211, 238, .30);

  transition:
    transform .2s,
    box-shadow .2s,
    background .2s;
}

.primary-button:hover {
  transform:
    translateY(-3px);

  background:
    linear-gradient(
      135deg,
      #06b6d4,
      #7c3aed
    );

  box-shadow:
    0 0 30px
    rgba(34, 211, 238, .60);
}

.primary-button:focus-visible {
  outline:
    3px solid
    rgba(103, 232, 249, .7);

  outline-offset: 4px;
}

.launch-note {
  margin-top: 11px;

  color: #64748b;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  letter-spacing: 2px;
}


/* ==================================================
   PROFILE STATUS
================================================== */

.system-status {
  position: absolute;
  right: 30px;
  bottom: 24px;

  z-index: 12;

  color: #4ade80;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
}

.system-status::before {
  content: "●";

  display: inline-block;
  margin-right: 7px;

  animation:
    statusBlink
    .8s
    step-end
    infinite;
}

@keyframes statusBlink {
  50% {
    opacity: .2;
  }
}


/* ==================================================
   GAME MODAL
================================================== */

.game-modal {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 18px;

  visibility: hidden;
  opacity: 0;
  pointer-events: none;

  background:
    rgba(2, 6, 23, .46);

  backdrop-filter:
    blur(0);

  transition:
    opacity .38s ease,
    visibility .38s ease,
    backdrop-filter .38s ease;
}

.game-modal.is-open {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;

  backdrop-filter:
    blur(5px);
}


/* ==================================================
   GAME WINDOW
================================================== */

.game-window {
  position: relative;

  width:
    min(
      96%,
      980px
    );

  height:
    min(
      96%,
      584px
    );

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .55);

  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(0, 8, 20, .96),

    0 0 35px
    rgba(34, 211, 238, .28),

  transition:
    transform .38s
    cubic-bezier(.22, 1, .36, 1);
}

.game-modal.is-open

  transform:

    translateY(0);
}

.game-window::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 2px;

  z-index: 4;

  background:

      transparent,
      #22d3ee,
      #8b5cf6,

      transparent

  box-shadow:
    0 0 14px #22d3ee;
}


/* ==================================================
   GAME HEADER
================================================== */

.game-header {
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: space-between;

    1px solid

.close-button:hover {
  color: #ffffff;

  transform:

}


/* ==================================================
   GAME BODY
================================================== */

.game-body {
  position: relative;

  height:
    calc(100% - 100px);

  padding:
    10px 14px;
}

.game-shell {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border:
    1px solid
    rgba(103, 232, 249, .28);

  border-radius: 10px;

  background: #000814;

  box-shadow:

    rgba(34, 211, 238, .06);
}

canvas {
  display: block;

  width: 100%;
  height: 100%;

  background: #000814;

  outline: none;
}


/* ==================================================
   LOADING OVERLAY
================================================== */

.loading-overlay {
  position: absolute;

  inset:
    10px 14px;

  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background:
    rgba(0, 8, 20, .95);

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.loading-overlay.is-hidden {
  visibility: hidden;
  opacity: 0;

  pointer-events: none;
}

.loader-panel {
  width:
    min(
      88%,
      610px
    );

  padding: 28px;

  border:
    1px solid
    rgba(103, 232, 249, .35);

  border-radius: 15px;

  background:
    rgba(2, 6, 23, .88);

  box-shadow:
    0 0 32px
    rgba(34, 211, 238, .13);

  font-family:
    Consolas,
    "Courier New",
    monospace;
}

.loader-title {
  color: #67e8f9;

  font-size: 12px;
  font-weight: 700;

  letter-spacing: 4px;
}

.loader-log {
  min-height: 125px;

  margin-top: 18px;

  color: #cbd5e1;

  font-size: 12px;

  line-height: 1.9;
}

.loader-log div::before {
  content: "› ";

  color: #4ade80;
}

.loader-bar {
  position: relative;

  height: 7px;

  margin-top: 17px;

  overflow: hidden;

  border-radius: 999px;

  background: #172554;
}

.loader-bar::after {
  content: "";

  position: absolute;
  inset: 0;

  width: 35%;

  background:
    linear-gradient(
      90deg,
      #22d3ee,
      #8b5cf6,
      #ec4899
    );

  box-shadow:
    0 0 18px #22d3ee;

  animation:
    loadingMove
    .72s
    ease-in-out
    infinite alternate;
}

@keyframes loadingMove {
  from {
    transform:
      translateX(-30%);
  }

  to {
    transform:
      translateX(205%);
  }
}


/* ==================================================
   GAME FOOTER
================================================== */

.game-footer {
  height: 48px;

  padding:
    0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-top:
    1px solid
    rgba(103, 232, 249, .16);

  background:
    rgba(2, 6, 23, .86);

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
}

.controls {
  color: #64748b;
}

.controls strong {
  color: #67e8f9;
}

.game-message {
  color: #fde68a;

  letter-spacing: 2px;

/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 760px) {

    border-radius: 12px;
  }

  .runtime-status {
    display: none;
  }

  .game-footer {
    padding: 0 10px;
  }
}

</style>
</head>

<script>

/* ==================================================
   ELEMENTS
================================================== */

const app =
  document.getElementById("app");

const playGame =
  document.getElementById("playGame");

const gameModal =
  document.getElementById("gameModal");

const closeGame =
  document.getElementById("closeGame");

const loadingOverlay =
  document.getElementById("loadingOverlay");

const loaderLog =
  document.getElementById("loaderLog");

const gameMessage =
  document.getElementById("gameMessage");

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const scoreElement =
  document.getElementById("score");


/* ==================================================
   STATE
================================================== */

const keys = {};

let running = false;
let modalOpen = false;
let cleared = false;
let score = 0;
let bullets = [];
let bugs = [];
let particles = [];
let bulletCooldown = false;


/* ==================================================
   PLAYER
================================================== */

const player = {
  x: 416,
  y: 420,
  width: 68,
  height: 24,
  speed: 6
};


/* ==================================================
   UTILITY
================================================== */

function wait(milliseconds) {

  return new Promise(resolve => {

    setTimeout(
      resolve,
      milliseconds
    );

  });

}


/* ==================================================
   OPEN GAME
================================================== */

async function openGame() {

  if (modalOpen) {
    return;
  }


  modalOpen = true;


  app.classList.add(
    "game-open"
  );


  gameModal.classList.add(
    "is-open"
  );


  loadingOverlay.classList.remove(
    "is-hidden"
  );


  loaderLog.innerHTML = "";


  gameMessage.textContent =
    "INITIALIZING...";


  const messages = [
    "INITIALIZING ABAP RUNTIME...",
    "LOADING BUG TABLE...",
    "ATTACHING DEBUGGER...",
    "ACTIVATING BREAKPOINTS...",
    "DEBUG SESSION READY"
  ];


  for (
    const message
    of messages
  ) {

    if (!modalOpen) {
      return;
    }


    const line =
      document.createElement(
        "div"
      );


    line.textContent =
      message;


    loaderLog.appendChild(
      line
    );


    await wait(210);

  }


  await wait(280);


  if (!modalOpen) {
    return;
  }


  startGame();


  loadingOverlay.classList.add(
    "is-hidden"
  );


  gameMessage.textContent =
    "TARGET: REMOVE ALL BUGS";


  canvas.focus();

}


/* ==================================================
   CLOSE GAME
================================================== */

function hideGame() {

  modalOpen = false;
  running = false;


  keys.arrowleft = false;
  keys.arrowright = false;
  keys.a = false;
  keys.d = false;


  app.classList.remove(
    "game-open"
  );


  gameModal.classList.remove(
    "is-open"
  );


  loadingOverlay.classList.remove(
    "is-hidden"
  );


  playGame.focus();

}


/* ==================================================
   CREATE BUGS
================================================== */

function createBugs() {

  bugs = [];


  for (
    let row = 0;
    row < 3;
    row++
  ) {

    for (
      let col = 0;
      col < 8;
      col++
    ) {

      bugs.push({

        x:
          95 +
          col * 90,

        y:
          72 +
          row * 54,

        width:
          46,

        height:
          28,

        direction:
          row % 2 === 0
            ? 1
            : -1,

        speed:
          .55 +
          row * .10,

        dead:
          false

      });

    }

  }

}


/* ==================================================
   START GAME
================================================== */

function startGame() {

  score = 0;
  bullets = [];
  particles = [];
  cleared = false;
  running = true;
  bulletCooldown = false;

  player.x = 416;

  scoreElement.textContent =
    "SCORE 0000";

  createBugs();

}


/* ==================================================
   KEYBOARD INPUT
================================================== */

window.addEventListener(
  "keydown",
  event => {

    if (!modalOpen) {
      return;
    }


    const key =
      event.key.toLowerCase();


    keys[key] = true;


    if (
      event.code === "Space"
    ) {

      event.preventDefault();

      shoot();

    }


    if (
      key === "r" &&
      cleared
    ) {

      startGame();

      gameMessage.textContent =
        "TARGET: REMOVE ALL BUGS";

    }


    if (
      key === "escape"
    ) {

      hideGame();

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }
);


/* ==================================================
   SHOOT
================================================== */

function shoot() {

  if (
    !modalOpen ||
    !running ||
    bulletCooldown
  ) {
    return;
  }


  bulletCooldown = true;


  bullets.push({

    x:
      player.x +
      player.width / 2 -
      2,

    y:
      player.y - 20,

    width:
      4,

    height:
      18,

    speed:
      9,

    dead:
      false

  });


  setTimeout(
    () => {

      bulletCooldown = false;

    },
    170
  );

}


/* ==================================================
   PARTICLES
================================================== */

function createExplosion(
  x,
  y
) {

  for (
    let index = 0;
    index < 12;
    index++
  ) {

    const angle =
      Math.random() *
      Math.PI *
      2;


    const speed =
      1 +
      Math.random() *
      2.8;


    particles.push({

      x,
      y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        28 +
        Math.random() *
        18,

      size:
        2 +
        Math.random() *
        3

    });

  }

}


/* ==================================================
   UPDATE
================================================== */

function update() {

  if (
    keys.arrowleft ||
    keys.a
  ) {

    player.x -=
      player.speed;

  }


  if (
    keys.arrowright ||
    keys.d
  ) {

    player.x +=
      player.speed;

  }


  player.x =
    Math.max(
      0,
      Math.min(
        canvas.width -
        player.width,
        player.x
      )
    );


  bullets.forEach(
    bullet => {

      bullet.y -=
        bullet.speed;

    }
  );


  bullets =
    bullets.filter(
      bullet =>
        bullet.y > -40 &&
        !bullet.dead
    );


  bugs.forEach(
    bug => {

      bug.x +=
        bug.direction *
        bug.speed;


      if (
        bug.x <= 15
      ) {

        bug.direction = 1;

      }


      if (
        bug.x +
        bug.width >=
        canvas.width -
        15
      ) {

        bug.direction = -1;

      }

    }
  );


  collisionCheck();


  particles.forEach(
    particle => {

      particle.x +=
        particle.vx;

      particle.y +=
        particle.vy;

      particle.vy +=
        .03;

      particle.life -=
        1;

    }
  );


  particles =
    particles.filter(
      particle =>
        particle.life > 0
    );


  if (
    bugs.length === 0 &&
    !cleared
  ) {

    cleared = true;

    running = false;

    gameMessage.textContent =
      "DEBUG COMPLETE // SY-SUBRC = 0";

  }

}


/* ==================================================
   COLLISION
================================================== */

function collisionCheck() {

  bullets.forEach(
    bullet => {

      bugs.forEach(
        bug => {

          if (
            bug.dead ||
            bullet.dead
          ) {
            return;
          }


          const hit =

            bullet.x <
              bug.x +
              bug.width

            &&

            bullet.x +
              bullet.width >
              bug.x

            &&

            bullet.y <
              bug.y +
              bug.height

            &&

            bullet.y +
              bullet.height >
              bug.y;


          if (hit) {

            bug.dead = true;

            bullet.dead = true;

            score += 100;


            createExplosion(

              bug.x +
              bug.width / 2,

              bug.y +
              bug.height / 2

            );

          }

        }
      );

    }
  );


  bugs =
    bugs.filter(
      bug =>
        !bug.dead
    );


  bullets =
    bullets.filter(
      bullet =>
        !bullet.dead
    );


  scoreElement.textContent =

    "SCORE " +

    String(score)
      .padStart(
        4,
        "0"
      );

}


/* ==================================================
   DRAW BACKGROUND
================================================== */

function drawBackground() {

  ctx.fillStyle =
    "#000814";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.strokeStyle =
    "rgba(34,211,238,.07)";


  ctx.lineWidth = 1;


  for (
    let x = 0;
    x <= canvas.width;
    x += 45
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.height
    );

    ctx.stroke();

  }


  for (
    let y = 0;
    y <= canvas.height;
    y += 45
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      canvas.width,
      y
    );

    ctx.stroke();

  }

}


/* ==================================================
   DRAW HUD
================================================== */

function drawHUD() {

  ctx.fillStyle =
    "#67e8f9";


  ctx.font =
    "12px Consolas";


  ctx.fillText(
    "RUNTIME: ACTIVE",
    20,
    27
  );


  ctx.fillStyle =
    "#64748b";


  ctx.fillText(
    "TARGET: REMOVE ALL BUGS",
    20,
    48
  );

}


/* ==================================================
   DRAW BUG
================================================== */

function drawBug(
  bug
) {

  ctx.fillStyle =
    "#ec4899";


  ctx.fillRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );


  ctx.strokeStyle =
    "#f9a8d4";


  ctx.strokeRect(
    bug.x,
    bug.y,
    bug.width,
    bug.height
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "12px Consolas";


  ctx.fillText(
    "BUG",
    bug.x + 10,
    bug.y + 18
  );

}


/* ==================================================
   DRAW PLAYER
================================================== */

function drawPlayer() {

  ctx.fillStyle =
    "#22d3ee";


  ctx.fillRect(
    player.x,
    player.y,
    player.width,
    player.height
  );


  ctx.fillStyle =
    "#67e8f9";


  ctx.fillRect(
    player.x +
      player.width / 2 -
      7,

    player.y - 12,

    14,
    12
  );


  ctx.fillStyle =
    "#020617";


  ctx.font =
    "bold 12px Consolas";


  ctx.fillText(
    "DEV",
    player.x + 21,
    player.y + 17
  );

}


/* ==================================================
   DRAW BULLETS
================================================== */

function drawBullets() {

  ctx.fillStyle =
    "#4ade80";


  bullets.forEach(
    bullet => {

      ctx.fillRect(
        bullet.x,
        bullet.y,
        bullet.width,
        bullet.height
      );

    }
  );

}


/* ==================================================
   DRAW PARTICLES
================================================== */

function drawParticles() {

  particles.forEach(
    particle => {

      const alpha =
        Math.max(
          0,
          particle.life /
          45
        );


      ctx.fillStyle =
        "rgba(244,114,182," +
        alpha +
        ")";


      ctx.fillRect(
        particle.x,
        particle.y,
        particle.size,
        particle.size
      );

    }
  );

}


/* ==================================================
   CLEAR SCREEN
================================================== */

function drawClear() {

  ctx.fillStyle =
    "rgba(2,6,23,.91)";


  ctx.fillRect(
    150,
    135,
    600,
    225
  );


  ctx.strokeStyle =
    "#4ade80";


  ctx.lineWidth = 2;


  ctx.strokeRect(
    150,
    135,
    600,
    225
  );


  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "#4ade80";


  ctx.font =
    "bold 42px Consolas";


  ctx.fillText(
    "DEBUG COMPLETE",
    canvas.width / 2,
    205
  );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "18px Consolas";


  ctx.fillText(
    "ALL BUGS REMOVED",
    canvas.width / 2,
    247
  );


  ctx.fillStyle =
    "#fde68a";


  ctx.font =
    "15px Consolas";


  ctx.fillText(
    "SY-SUBRC = 0",
    canvas.width / 2,
    286
  );


  ctx.fillStyle =
    "#94a3b8";


  ctx.font =
    "13px Consolas";


  ctx.fillText(
    "PRESS R TO RESTART",
    canvas.width / 2,
    325
  );


  ctx.textAlign =
    "start";

}


/* ==================================================
   DRAW
================================================== */

function draw() {

  drawBackground();

  drawHUD();


  bugs.forEach(
    drawBug
  );


  drawBullets();

  drawParticles();

  drawPlayer();


  if (cleared) {

    drawClear();

  }

}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop() {

  if (
    modalOpen
  ) {

    if (
      running &&
      loadingOverlay
        .classList
        .contains(
          "is-hidden"
        )
    ) {

      update();

    }


    if (
      loadingOverlay
        .classList
        .contains(
          "is-hidden"
        )
    ) {

      draw();

    }

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* ==================================================
   EVENTS
================================================== */

playGame.addEventListener(
  "click",
  openGame
);


closeGame.addEventListener(
  "click",
  hideGame
);


gameModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      gameModal
    ) {

      hideGame();

    }

  }
);


/* ==================================================
   START LOOP
================================================== */

requestAnimationFrame(
  gameLoop
);

</script>


</body>
</html>
